<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>KANTİN</title>
<style>
  :root {
    --bg: #0b1120; --card: #1e293b; --card2: #334155;
    --primary: #3b82f6; --primary-glow: rgba(59,130,246,.4);
    --success: #22c55e; --danger: #ef4444; --warn: #f59e0b;
    --text: #f1f5f9; --muted: #94a3b8; --border: #334155;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:165px}
  .header{background:linear-gradient(135deg,#0f172a,#1e3a8a);padding:16px 16px 14px;position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(59,130,246,.25)}
  .header h1{font-size:1.25rem;font-weight:700}
  .header p{font-size:.75rem;color:var(--muted);margin-top:2px}
  .tabs{display:flex;gap:8px;margin-top:12px}
  .tabs button{flex:1;padding:11px;border:none;border-radius:12px;background:rgba(255,255,255,.08);color:var(--muted);font-weight:600;font-size:.9rem}
  .tabs button.active{background:var(--primary);color:#fff;box-shadow:0 0 18px var(--primary-glow)}
  .container{padding:14px;max-width:480px;margin:0 auto}
  .search{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font-size:1rem;background:var(--card);color:var(--text);margin-bottom:12px;outline:none}
  .card{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border)}
  .card h3{font-size:.95rem;font-weight:600}
  .meta{font-size:.78rem;color:var(--muted);margin-top:2px}
  .price{font-weight:700;color:#60a5fa;font-size:1.05rem}
  .stock{font-size:.75rem;padding:2px 8px;border-radius:20px;display:inline-block;margin-top:3px;font-weight:600}
  .stock-ok{background:rgba(34,197,94,.15);color:#4ade80}
  .stock-low{background:rgba(234,179,8,.15);color:#facc15}
  .stock-zero{background:rgba(239,68,68,.15);color:#f87171}
  .total-bar{background:linear-gradient(135deg,#1e3a8a,#2563eb);border-radius:14px;padding:14px 16px;margin-top:14px;font-weight:700;display:flex;justify-content:space-between;box-shadow:0 4px 18px rgba(30,64,175,.3)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border:none;border-radius:12px;font-weight:600;font-size:.95rem;cursor:pointer}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-success{background:var(--success);color:#fff}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-warn{background:var(--warn);color:#111}
  .btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}
  .btn-block{width:100%}
  .fab{position:fixed;bottom:165px;right:16px;width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:1.7rem;box-shadow:0 6px 22px var(--primary-glow);z-index:40}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
  .modal-bg.show{display:flex}
  .modal{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 16px;max-height:94vh;overflow-y:auto;border-top:1px solid var(--border);color:#f1f5f9}
  .modal h2{font-size:1.15rem;margin-bottom:16px}
  .form-group{margin-bottom:13px}
  .form-group label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:5px}
  .form-group input,.form-group select{width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;font-size:1rem;background:var(--bg);color:var(--text);outline:none}
  .form-row{display:flex;gap:10px}
  .form-row .form-group{flex:1}
  .cart-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
  .cart-total{font-size:1.45rem;font-weight:700;text-align:right;margin:16px 0;color:#60a5fa}
  .empty{text-align:center;padding:40px 16px;color:var(--muted)}
  .toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:11px 18px;border-radius:12px;font-size:.9rem;z-index:200;opacity:0;transition:.25s;pointer-events:none;border:1px solid var(--border)}
  .toast.show{opacity:1}
.bottom-bar{position:fixed;bottom:48px;left:8px;right:8px;background:rgba(15,23,42,.97);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:18px;padding:10px 6px;display:flex;gap:5px;z-index:30;box-shadow:0 8px 28px rgba(0,0,0,.35);padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .bottom-bar button{border-radius:12px !important}
  .bottom-bar button{flex:1;padding:10px 3px;border-radius:11px;border:none;font-weight:600;font-size:.8rem;background:var(--card2);color:var(--text)}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
  .sheet.show{display:flex}
  .sheet-content{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;max-height:96vh;height:96vh;overflow-y:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--border);transition:height .28s ease,max-height .28s ease,transform .2s ease;touch-action:pan-y;color:#f1f5f9}
  .sheet-content.expanded{max-height:96vh;height:96vh}
  .sheet-content h2{font-size:1.15rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .sheet-handle{width:42px;height:5px;background:var(--border);border-radius:4px;margin:6px auto 12px;flex-shrink:0}
  .month-header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:11px 14px;border-radius:11px;margin:14px 0 8px;font-weight:700;display:flex;justify-content:space-between;cursor:pointer}
  .day-header{font-weight:600;font-size:.85rem;color:var(--muted);margin:10px 0 6px;padding:8px 10px;background:var(--bg);border-radius:10px;border:1px solid var(--border);display:flex;justify-content:space-between;cursor:pointer}
  .sale-item{background:var(--bg);border-radius:10px;padding:11px 13px;margin-bottom:6px;border:1px solid var(--border);color:var(--text)}
  .scanner-wrap{background:#000;border-radius:16px;overflow:hidden;margin-bottom:12px;position:relative;height:260px}
  #liveScanner{width:100%;height:100%}
  #liveScanner video{object-fit:cover !important;width:100% !important;height:100% !important}
  #productScanner{width:100% !important;height:260px !important}
  #productScanner video{object-fit:cover !important;width:100% !important;height:260px !important;display:block !important}
  #productScanner img{display:none !important}
  .scan-line{position:absolute;left:8%;right:8%;top:50%;height:2px;background:#facc15;box-shadow:0 0 10px #facc15,0 0 20px rgba(250,204,21,.5);z-index:5;pointer-events:none;border-radius:2px;animation:scanPulse 1.2s ease-in-out infinite}
  @keyframes scanPulse{0%,100%{opacity:.7}50%{opacity:1}}
  .scanner-status{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;font-size:.78rem;padding:5px 12px;border-radius:20px;z-index:6;white-space:nowrap}
  .scanner-status.active{background:rgba(34,197,94,.85)}
  .v-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .v-swipe-wrap{position:relative;margin-bottom:8px;border-radius:12px;overflow:hidden;background:#991b1b;touch-action:pan-y}
  .v-swipe-actions{position:absolute;right:0;top:0;bottom:0;width:96px;display:flex;z-index:1}
  .v-swipe-del{width:100%;border:none;background:#dc2626;color:#fff;font-weight:800;font-size:1rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .v-swipe-content{position:relative;z-index:2;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;transition:transform .55s cubic-bezier(.22,.61,.36,1);will-change:transform;touch-action:pan-y;user-select:none;-webkit-user-select:none}

  .v-bal{font-size:1.15rem;font-weight:700;color:#fbbf24}
  .summary-row{display:flex;gap:8px;margin-bottom:12px}
  .summary-box{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
  .summary-box .lbl{font-size:.75rem;color:var(--muted)}
  .summary-box .val{font-size:1.05rem;font-weight:700;margin-top:4px}

  .backup-banner{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);color:#fbbf24;padding:10px 12px;border-radius:12px;margin-bottom:12px;font-size:.85rem;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .backup-banner button{flex-shrink:0}
  .guide-box{background:var(--card);border:1px dashed var(--border);border-radius:14px;padding:20px 16px;text-align:center;margin:12px 0}
  .guide-box h3{margin-bottom:8px;font-size:1rem}
  .guide-box p{color:var(--muted);font-size:.88rem;margin-bottom:12px;line-height:1.45}
  .manual-row{display:flex;gap:8px;margin-bottom:10px}
  .manual-row input{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font-size:1rem;background:var(--card);color:var(--text);outline:none}
  .change-box{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;margin:10px 0}
  .change-box .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .low-stock-hint{font-size:.75rem;color:#facc15;margin-top:4px}

</style>
</head>

  <div class="container" id="content"></div>
  <button class="fab" id="fab" style="display:none">+</button>

  <div class="bottom-bar">
    <button onclick="openSales()">Satışlar</button>
    <button onclick="openVeresiye()">Veresiye</button>
    <button onclick="openToplam()">Toplam</button>
    <button onclick="toggleDataMenu()" id="dataMenuBtn" style="color:#facc15 !important;font-size:1.7rem !important;font-weight:800;line-height:1;padding:4px 2px">♻️</button>
  </div>
  <div id="dataMenu" style="display:none;position:fixed;bottom:120px;right:16px;z-index:40;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px;box-shadow:0 8px 30px rgba(0,0,0,.4);min-width:150px">
    <button class="btn btn-secondary btn-block" style="margin-bottom:6px" onclick="exportExcel();hideDataMenu()">Excel İndir (6 sayfa)</button>
    <button class="btn btn-secondary btn-block" onclick="document.getElementById('excelInput').click();hideDataMenu()">Excel / CSV Yükle</button>
  </div>
  <input type="file" id="excelInput" accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none" onchange="importExcel(event)">

  <div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
  <div class="sheet" id="salesSheet"><div class="sheet-content" id="salesContent"></div></div>
  <div class="sheet" id="veresiyeSheet"><div class="sheet-content" id="veresiyeContent"></div></div>

  <script>
    function safeParse(key, fallback){
      try {
        const raw = localStorage.getItem(key);
        if(raw == null || raw === '') return fallback;
        const v = JSON.parse(raw);
        return v == null ? fallback : v;
      } catch(e){
        console.error('Veri okuma hatası:', key, e);
        return fallback;
      }
    }
    let products = safeParse('bf_stok', []);
    let salesHistory = safeParse('bf_sales', []);
    let veresiye = safeParse('bf_veresiye', []); // {id, name, entries:[{id,date,total,items,paid}], deleted?}
    // isimler birleştirilecek init'te
    // Stok/fiyat her zaman sayı olsun (string gelirse "Stok yok" hatası oluşuyordu)
    products = (Array.isArray(products) ? products : []).map(p => ({
      ...p,
      id: p.id || (Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
      name: String(p.name || '').trim() || 'İsimsiz',
      barcode: p.barcode != null ? String(p.barcode) : '',
      price: Number(p.price) || 0,
      stock: Math.max(0, parseInt(p.stock, 10) || 0)
    }));
    salesHistory = Array.isArray(salesHistory) ? salesHistory : [];
    veresiye = Array.isArray(veresiye) ? veresiye : [];
    let cart = [];
    let tab = 'sales';
    let liveScanner = null;
    let lastCode = '', lastScanTime = 0;
    let editId = null;
    let audioCtx = null;
    let deletedSalesStack = [];
    let deletedVeresiyeStack = [];
    let saleInProgress = false; // çift tıklama ile çift stok düşmesini engeller

    function storageErrorToast(e){
      if(e && (e.name === 'QuotaExceededError' || e.code === 22)){
        toast('Depolama dolu! Eski satışları silin veya Excel yedek alıp temizleyin');
      }
    }
    function save(){
      try {
        // Kaydetmeden önce stok/fiyatı sayıya çevir
        products.forEach(p => {
          p.price = Number(p.price) || 0;
          p.stock = Math.max(0, parseInt(p.stock, 10) || 0);
        });
        localStorage.setItem('bf_stok', JSON.stringify(products));
      } catch(e){ console.error('Stok kaydetme hatası', e); storageErrorToast(e); }
    }
    function saveSales(){
      try { localStorage.setItem('bf_sales', JSON.stringify(salesHistory)); }
      catch(e){ console.error('Satış kaydetme hatası', e); storageErrorToast(e); }
    }
    function saveVeresiye(){
      try {
        mergeVeresiyeNames();
        localStorage.setItem('bf_veresiye', JSON.stringify(veresiye));
      } catch(e){ console.error('Veresiye kaydetme hatası', e); storageErrorToast(e); }
    }
    function saveAll(){
      save();
      saveSales();
      saveVeresiye();
    }
    function normName(n){ return String(n||'').trim().replace(/\s+/g,' '); }
    function mergeVeresiyeNames(){
      const map = {};
      const order = [];
      veresiye.forEach(p=>{
        const key = normName(p.name).toLocaleLowerCase('tr');
        if(!key) return;
        if(!map[key]){
          map[key] = { id: p.id, name: normName(p.name), entries: [] };
          order.push(key);
        }
        const entries = Array.isArray(p.entries) ? p.entries : [];
        map[key].entries = map[key].entries.concat(entries);
      });
      // Aynı entry id tekrarını temizle, tarihe göre sırala
      order.forEach(key=>{
        const seen = {};
        map[key].entries = map[key].entries.filter(e=>{
          if(!e || !e.id) return true;
          if(seen[e.id]) return false;
          seen[e.id] = true;
          return true;
        }).sort((a,b)=> new Date(b.date) - new Date(a.date));
      });
      veresiye = order.map(k=>map[k]);
    }
    function money(n){ return Number(n||0).toFixed(2).replace('.',',') + ' ₺'; }
    function esc(s){
      return String(s==null?'':s)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }
    function openPhoto(){ const el=document.getElementById('photoLightbox'); if(el){ el.style.display='flex'; } }
    function closePhoto(){ const el=document.getElementById('photoLightbox'); if(el){ el.style.display='none'; } }
    function toast(m){ const t=document.getElementById('toast'); if(!t) return; t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
    function id(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

    // ===== YEDEK HATIRLATMA =====
    function getLastBackup(){
      try { return localStorage.getItem('bf_last_backup') || ''; } catch(e){ return ''; }
    }
    function markBackupDone(){
      try { localStorage.setItem('bf_last_backup', new Date().toISOString()); } catch(e){}
    }
    function backupBannerHTML(){
      const last = getLastBackup();
      let msg = 'Henüz yedek alınmamış. Veriler sadece bu cihazda; kaybolabilir.';
      let urgent = true;
      if(last){
        const days = Math.floor((Date.now() - new Date(last).getTime()) / 86400000);
        if(days <= 0){ msg = 'Yedek bugün alındı ✓'; urgent = false; }
        else if(days === 1){ msg = 'Son yedek dün alındı'; urgent = false; }
        else if(days < 7){ msg = 'Son yedek ' + days + ' gün önce'; urgent = days >= 3; }
        else { msg = 'Son yedek ' + days + ' gün önce — yedek alın!'; urgent = true; }
      }
      if(!urgent && last) return '';
      return `<div class="backup-banner">
        <span>💾 ${msg}</span>
        <button type="button" class="btn btn-warn" style="padding:6px 10px;font-size:.8rem" onclick="exportExcel()">Excel Yedekle</button>
      </div>`;
    }


    function personBalance(p){
      return (p.entries||[]).filter(e=>!e.paid).reduce((s,e)=>s+e.total,0);
    }
    function totalVeresiye(){ return veresiye.reduce((s,p)=>s+personBalance(p),0); }
    function totalSales(){ return salesHistory.reduce((s,x)=>s+x.total,0); }

    function beep(){
      try{
        if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        const o=audioCtx.createOscillator(), g=audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value=1800; o.type='square';
        g.gain.setValueAtTime(0.15, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.12);
        o.start(); o.stop(audioCtx.currentTime+0.12);
      }catch(e){}
      if(navigator.vibrate) navigator.vibrate(40);
    }
    function saleSuccessSound(){
      try{
        if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        const now=audioCtx.currentTime;
        [523.25,659.25,783.99].forEach((freq,i)=>{
          const o=audioCtx.createOscillator(), g=audioCtx.createGain();
          o.connect(g); g.connect(audioCtx.destination);
          o.type='sine'; o.frequency.value=freq;
          const t0=now+i*0.09;
          g.gain.setValueAtTime(0,t0);
          g.gain.linearRampToValueAtTime(0.12,t0+0.02);
          g.gain.exponentialRampToValueAtTime(0.001,t0+0.22);
          o.start(t0); o.stop(t0+0.25);
        });
      }catch(e){}
      if(navigator.vibrate) navigator.vibrate([30,40,30]);
    }

    // Aşağı: kapat | Yukarı: tam ekran
    function enableSwipeClose(sheetId, contentId, closeFn){
      const el = document.getElementById(contentId);
      if(!el) return;
      el.classList.remove('expanded');
      el.style.height = '';
      el.style.maxHeight = '';
      el.style.transform = '';
      if(el._swipeBound) return;
      el._swipeBound = true;
      let startY = 0, currentY = 0, dragging = false;
      el.addEventListener('touchstart', (e)=>{
        startY = e.touches[0].clientY;
        currentY = startY;
        dragging = true;
      }, {passive:true});
      el.addEventListener('touchmove', (e)=>{
        if(!dragging) return;
        currentY = e.touches[0].clientY;
        const dy = currentY - startY;
        // aşağı çekerken (en üstteyken) görsel kaydır
        if(dy > 0 && el.scrollTop <= 0){
          el.style.transition = 'none';
          el.style.transform = 'translateY(' + Math.min(dy, 300) + 'px)';
        }
      }, {passive:true});
      el.addEventListener('touchend', ()=>{
        if(!dragging) return;
        dragging = false;
        const dy = currentY - startY;
        el.style.transition = 'transform .25s ease, height .28s ease, max-height .28s ease';
        if(dy > 110 && el.scrollTop <= 0){
          // kapat
          el.style.transform = 'translateY(100%)';
          setTimeout(()=>{ el.style.transform = ''; el.classList.remove('expanded'); closeFn(); }, 220);
        } else if(dy < -80){
          // yukarı → tam ekran
          el.style.transform = '';
          el.classList.add('expanded');
        } else {
          el.style.transform = '';
        }
      });
    }

    function render(){
      const c=document.getElementById('content');
      const fab=document.getElementById('fab');
      stopLiveScanner();
      if(tab==='list'){
        fab.style.display='block';
        fab.onclick=()=>openModal();
        const totalValue=products.reduce((s,p)=>s+(p.price||0)*(p.stock||0),0);
        const lowStock = products.filter(p => (parseInt(p.stock,10)||0) > 0 && (parseInt(p.stock,10)||0) <= 5).length;
        const zeroStock = products.filter(p => (parseInt(p.stock,10)||0) <= 0).length;
        c.innerHTML=`
          ${backupBannerHTML()}
          <div class="summary-row">
            <div class="summary-box"><div class="lbl">Satış Toplamı</div><div class="val" style="color:#4ade80">${money(totalSales())}</div></div>
            <div class="summary-box"><div class="lbl">Veresiye Bakiye</div><div class="val" style="color:#fbbf24">${money(totalVeresiye())}</div></div>
          </div>
          ${lowStock||zeroStock?`<div class="low-stock-hint">⚠ ${zeroStock?zeroStock+' üründe stok yok':''}${zeroStock&&lowStock?' · ':''}${lowStock?lowStock+' üründe stok az (≤5)':''}</div>`:''}
          <input class="search" placeholder="Ürün veya barkod ara..." oninput="filter(this.value)">
          <div id="list"></div>
          <div class="total-bar"><span>Stok Toplam Değeri</span><span>${money(totalValue)}</span></div>`;
        filter('');
      } else {
        fab.style.display='none';
        c.innerHTML=`
          ${backupBannerHTML()}
          <div class="scanner-wrap">
            <div id="liveScanner"></div>
            <div class="scan-line"></div>
            <div class="scanner-status" id="scanStatus">Kamera açılıyor...</div>
          </div>
          <div class="manual-row">
            <input id="manualBarcode" type="text" inputmode="numeric" placeholder="Barkodu yazın veya yapıştırın" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();manualBarcodeSubmit();}">
            <button class="btn btn-primary" type="button" onclick="manualBarcodeSubmit()">Ekle</button>
          </div>
          <div style="display:flex;gap:8px;margin-bottom:10px">
            <button class="btn btn-secondary btn-block" onclick="cart=[];updateCartUI()">Temizle</button>
            <button class="btn btn-secondary" type="button" onclick="document.getElementById('manualBarcode')&&document.getElementById('manualBarcode').focus()">Manuel</button>
          </div>
          <div id="cart"></div>

    function filter(q){
      q=(q||'').toLowerCase();
      const list=document.getElementById('list');
      const filtered=products.filter(p=>!q||(p.name||'').toLowerCase().includes(q)||(p.barcode||'').includes(q));
      filtered.sort((a,b)=>(a.name||'').localeCompare(b.name||'','tr',{sensitivity:'base'}));
      if(!filtered.length){
        if(!products.length){
          list.innerHTML=`<div class="guide-box">
            <h3>Henüz ürün yok</h3>
            <p>Satışa başlamak için ürün ekleyin. Barkodlu ürünlerde kamera ile hızlı satış yapabilirsiniz.</p>
            <button class="btn btn-primary" onclick="openModal()">+ İlk Ürünü Ekle</button>
            <button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="document.getElementById('excelInput').click()">Excel / CSV Yükle</button>
          </div>`;
        } else {
          list.innerHTML=`<div class="empty">Sonuç yok</div>`;
        }
        return;
      }
      list.innerHTML=filtered.map(p=>{
        const stok = Math.max(0, parseInt(p.stock, 10) || 0);
        const sc = stok<=0 ? 'stock-zero' : stok<=5 ? 'stock-low' : 'stock-ok';
        const st = stok<=0 ? 'Stok yok' : stok + ' adet';
        return `<div class="card" onclick="openModal('${esc(p.id)}')">
          <div><h3>${esc(p.name)}</h3><div class="meta">${esc(p.barcode||'Barkod yok')}</div></div>
          <div style="text-align:right"><div class="price">${money(p.price)}</div><div class="stock ${sc}">${st}</div></div></div>`;
      }).join('');
    }

    function updateCartUI(){
      const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
      const cartEl=document.getElementById('cart');
      const extra=document.getElementById('cartExtra');
      if(!cartEl) return;
      cartEl.innerHTML=cart.length===0?'<div class="empty">Sepet boş<br>Barkodu sarı çizgiye tut</div>':
        cart.map((i,idx)=>`
          <div class="cart-item">
            <div><strong>${esc(i.name)}</strong><br><small style="color:var(--muted)">${money(i.price)} × ${i.qty}</small></div>
            <div style="display:flex;align-items:center;gap:7px">
              <button class="btn btn-secondary" style="padding:6px 11px" onclick="chg(${idx},-1)">−</button>
              <span style="min-width:20px;text-align:center;font-weight:600">${i.qty}</span>
              <button class="btn btn-secondary" style="padding:6px 11px" onclick="chg(${idx},1)">+</button>
              <button class="btn btn-danger" style="padding:6px 11px" onclick="cart.splice(${idx},1);updateCartUI()">×</button>
            </div>
          </div>`).join('');
      if(extra){
        extra.innerHTML=cart.length?`
          <div class="cart-total">${money(total)}</div>
          <div class="change-box">
            <label style="font-size:.8rem;color:var(--muted);font-weight:600">Alınan tutar (para üstü için, isteğe bağlı)</label>
            <input id="cashReceived" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Örn: 100" style="width:100%;margin-top:6px;padding:12px;border:1px solid var(--border);border-radius:11px;font-size:1rem;background:var(--card);color:var(--text);outline:none" oninput="updateChangeUI(${total})">
            <div class="row"><span style="color:var(--muted)">Para üstü</span><strong id="changeAmount" style="color:#4ade80">—</strong></div>
          </div>
          <button class="btn btn-success btn-block" onclick="finishSale()">Satışı Tamamla</button>
          <button class="btn btn-warn btn-block" style="margin-top:8px" onclick="openVeresiyeFromCart()">Veresiye Yaz</button>`:'';
      }
    }

    function chg(idx,d){
      const item=cart[idx];
      const p=products.find(x=>x.id===item.id);
      const nq=item.qty+d;
      const stok = p ? Math.max(0, parseInt(p.stock, 10) || 0) : 0;
      if(nq<1) cart.splice(idx,1);
      else if(p && nq > stok){ toast('Stok yetersiz'); return; }
      else item.qty=nq;
      updateCartUI();
    }

    function deductStock(){
      cart.forEach(item=>{
        const p=products.find(x=>x.id===item.id);
        if(p){
          const stok = Math.max(0, parseInt(p.stock, 10) || 0);
          p.stock = Math.max(0, stok - (item.qty || 0));
        }
      });
      save();
    }
    // Satış silinince / geri alınınca stok düzeltmesi
    // Sadece gerçek ürün satışlarında (elle giriş ve veresiye tahsilatı hariç)
    function adjustStockFromSaleItems(items, direction){
      // direction: -1 = stok düş, +1 = stok geri ekle
      if(!Array.isArray(items)) return;
      items.forEach(it=>{
        if(!it) return;
        // id varsa id ile, yoksa isim ile eşle
        let p = it.id ? products.find(x=>x.id===it.id) : null;
        if(!p && it.name){
          p = products.find(x=>normName(x.name).toLocaleLowerCase('tr')===normName(it.name).toLocaleLowerCase('tr'));
        }
        if(!p) return;
        const qty = Math.max(0, parseInt(it.qty, 10) || 0);
        const stok = Math.max(0, parseInt(p.stock, 10) || 0);
        p.stock = Math.max(0, stok + (direction * qty));
      });
      save();
    }
    function saleAffectsStock(s){
      // Elle satış ve veresiye tahsilatı stok düşürmemişti
      return s && !s.manual && !s.fromVeresiye;
    }

    function updateChangeUI(total){
      const el = document.getElementById('changeAmount');
      const inp = document.getElementById('cashReceived');
      if(!el || !inp) return;
      const received = parseFloat(String(inp.value).replace(',','.'));
      if(!isFinite(received) || received <= 0){ el.textContent = '—'; el.style.color = '#4ade80'; return; }
      const change = received - total;
      if(change < 0){ el.textContent = 'Eksik: ' + money(Math.abs(change)); el.style.color = '#f87171'; }
      else { el.textContent = money(change); el.style.color = '#4ade80'; }
    }
    function finishSale(){
      if(!cart.length || saleInProgress) return;
      // Stok kontrolü: sepet miktarı mevcut stoku aşmasın
      for(const item of cart){
        const p = products.find(x => x.id === item.id);
        const stok = p ? Math.max(0, parseInt(p.stock, 10) || 0) : 0;
        if(!p){ toast('Ürün bulunamadı: ' + (item.name||'')); return; }
        if(item.qty > stok){ toast('Stok yetersiz: ' + p.name + ' (stok: ' + stok + ')'); return; }
      }
      const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
      const cashEl = document.getElementById('cashReceived');
      let received = cashEl ? parseFloat(String(cashEl.value).replace(',','.')) : NaN;
      if(isFinite(received) && received > 0 && received < total){
        if(!confirm('Alınan tutar toplamdan düşük. Yine de tamamla?')) return;
      }
      saleInProgress = true;
      try {
        const sale = {
          id:id(),
          date:new Date().toISOString(),
          total,
          items:cart.map(i=>({id:i.id, name:i.name, qty:i.qty, price:i.price}))
        };
        if(isFinite(received) && received > 0){
          sale.cashReceived = received;
          sale.change = Math.max(0, received - total);
        }
        salesHistory.unshift(sale);
        saveSales();
        deductStock();
        cart=[];
        updateCartUI();
        saleSuccessSound();
        let msg = 'Satış tamamlandı · ' + money(total);
        if(sale.change != null) msg += ' · Üstü ' + money(sale.change);
        toast(msg);
      } finally {
        setTimeout(()=>{ saleInProgress = false; }, 600);
      }
    }

    // ===== VERESİYE =====
    function openVeresiyeFromCart(){
      if(!cart.length) return;
      stopLiveScanner();
      const names=veresiye.map(v=>v.name).sort((a,b)=>a.localeCompare(b,'tr',{sensitivity:'base'}));
      document.getElementById('modal').innerHTML=`
        <h2>Veresiye Yaz</h2>
        <div class="form-group"><label>Müşteri Adı</label>
          <input id="vName" list="vNames" placeholder="İsim yazın veya seçin">
          <datalist id="vNames">${names.map(n=>`<option value="${n}">`).join('')}</datalist>
        </div>
        <div style="background:var(--bg);border-radius:10px;padding:12px;margin-bottom:12px;border:1px solid var(--border)">
          <div style="font-weight:600;margin-bottom:6px">Sepet · ${money(cart.reduce((s,i)=>s+i.price*i.qty,0))}</div>
          ${cart.map(i=>`<div style="display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)"><span>${i.name} × ${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}
        </div>
        <button class="btn btn-warn btn-block" onclick="confirmVeresiye()">Veresiyeye Kaydet (Stok Düş)</button>
        <button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="closeModal()">İptal</button>`;
      document.getElementById('modalBg').classList.add('show');
    }

    function confirmVeresiye(){
      if(saleInProgress) return;
      const name=normName(document.getElementById('vName').value||'');
      if(!name){ toast('Müşteri adı gerekli'); return; }
      if(!cart.length){ toast('Sepet boş'); return; }
      for(const item of cart){
        const p = products.find(x => x.id === item.id);
        const stok = p ? Math.max(0, parseInt(p.stock, 10) || 0) : 0;
        if(!p || item.qty > stok){ toast('Stok yetersiz: ' + (p ? p.name : item.name)); return; }
      }
      saleInProgress = true;
      try {
        const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
        // Ürün id'sini de sakla (ileride stok düzeltmesi için)
        const entry={id:id(),date:new Date().toISOString(),total,items:cart.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price})),paid:false};
        mergeVeresiyeNames();
        let person=veresiye.find(v=>normName(v.name).toLocaleLowerCase('tr')===name.toLocaleLowerCase('tr'));
        if(!person){ person={id:id(),name,entries:[]}; veresiye.unshift(person); }
        person.entries.unshift(entry);
        saveVeresiye();
        deductStock();
        cart=[];
        closeModal();
        updateCartUI();
        saleSuccessSound();
        toast('Veresiye yazıldı · '+name+' · '+money(total));
      } finally {
        setTimeout(()=>{ saleInProgress = false; }, 600);
      }
    }

    function openManualVeresiye(){
      const names = veresiye.map(v=>v.name).sort((a,b)=>a.localeCompare(b,'tr',{sensitivity:'base'}));
      document.getElementById('modal').innerHTML = `
        <h2>Elle Borç Girişi</h2>
        <div class="form-group"><label>Müşteri Adı</label>
          <input id="mvName" list="mvNames" placeholder="İsim yazın veya seçin">
          <datalist id="mvNames">${names.map(n=>`<option value="${n}">`).join('')}</datalist>
        </div>
        <div class="form-group"><label>Tutar (₺)</label>
          <input id="mvAmount" type="number" step="0.01" min="0" placeholder="0.00">
        </div>

      document.getElementById('modalBg').classList.add('show');
    }

    function confirmManualVeresiye(){
      const name = normName(document.getElementById('mvName').value||'');
      const amount = parseFloat(document.getElementById('mvAmount').value)||0;
      const note = (document.getElementById('mvNote').value||'').trim();
      if(!name){ toast('Müşteri adı gerekli'); return; }
      if(amount <= 0){ toast('Geçerli tutar girin'); return; }
      const items = note ? [{name: note, qty: 1, price: amount}] : [{name: 'Elle giriş', qty: 1, price: amount}];
      const entry = {id: id(), date: new Date().toISOString(), total: amount, items, paid: false, manual: true};
      mergeVeresiyeNames();
      let person = veresiye.find(v => normName(v.name).toLocaleLowerCase('tr') === name.toLocaleLowerCase('tr'));
      if(!person){ person = {id: id(), name, entries: []}; veresiye.unshift(person); }
      person.entries.unshift(entry);
      saveVeresiye();
      closeModal();
      renderVeresiye();
      saleSuccessSound();
      toast('Elle borç eklendi · ' + name + ' · ' + money(amount));
    }

    function openVeresiye(){ hideDataMenu();
      stopLiveScanner();
      renderVeresiye();
      document.getElementById('veresiyeSheet').classList.add('show');
      enableSwipeClose('veresiyeSheet','veresiyeContent',closeVeresiye);
    }

    function renderVeresiye(){
      const el=document.getElementById('veresiyeContent');
      let undo='';
      if(deletedVeresiyeStack.length) undo=`<button class="btn btn-secondary" style="padding:6px 10px" onclick="undoVeresiye()">Geri Al</button>`;
      let html=`<div class="sheet-handle"></div><h2>Veresiye <span style="display:flex;gap:6px">${undo}<button class="btn btn-secondary" style="padding:6px 12px" onclick="closeVeresiye()">Kapat</button></span></h2>
        <button class="btn btn-warn btn-block" style="margin-bottom:12px" onclick="openManualVeresiye()">+ Elle Borç Girişi</button>
        <div class="summary-row">
          <div class="summary-box"><div class="lbl">Toplam Veresiye</div><div class="val" style="color:#fbbf24">${money(totalVeresiye())}</div></div>
          <div class="summary-box"><div class="lbl">Kişi</div><div class="val">${veresiye.filter(v=>personBalance(v)>0).length}</div></div>
        </div>`;
      if(!veresiye.length){ html+=`<div class="empty">Veresiye kaydı yok</div>`; el.innerHTML=html; return; }
      const sortedVeresiye = [...veresiye].sort((a,b)=>(a.name||'').localeCompare(b.name||'','tr',{sensitivity:'base'}));
      sortedVeresiye.forEach((p,pi)=>{
        const bal=personBalance(p);
        const openId='vp_'+p.id;
        const sira = pi + 1;
        html+=`<div class="v-swipe-wrap" data-pid="${p.id}">
          <div class="v-swipe-actions">
            <button type="button" class="v-swipe-del">Sil</button>
          </div>
          <div class="v-swipe-content" id="vswipe_${p.id}">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
              <div style="flex:1;cursor:pointer;min-width:0" onclick="toggleBlock('${openId}')">
                <strong>▸ ${sira}. ${p.name}</strong>
                <div class="meta">${(p.entries||[]).length} kayıt</div>
              </div>
              <div style="text-align:right;flex-shrink:0">
                <div class="v-bal" style="cursor:pointer" onclick="toggleBlock('${openId}')">${money(bal)}</div>
                <div style="margin-top:4px">
                  <button type="button" class="btn btn-secondary" style="padding:4px 8px;font-size:.75rem" onclick="editPersonName('${p.id}')">Düzenle</button>
                </div>
              </div>
            </div>
            <div id="${openId}" style="display:none;margin-top:10px">`;
        (p.entries||[]).forEach(e=>{
          const d=new Date(e.date);
          const day=d.toLocaleDateString('tr-TR',{day:'2-digit',month:'long',year:'numeric'});
          const time=d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
          const items=(e.items||[]).map(it=>`<div style="display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)"><span>${it.name} × ${it.qty}</span><span>${money(it.price*it.qty)}</span></div>`).join('');
          html+=`<div class="sale-item" style="opacity:${e.paid?.5:1}">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
              <div><strong>${day}</strong><div class="meta">${time}</div></div>
              <strong style="color:${e.paid?'#4ade80':'#fbbf24'}">${money(e.total)}${e.paid?' · Ödendi':''}</strong>
            </div>
            ${items}
            <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
              ${!e.paid?`<button class="btn btn-success" style="padding:6px 10px;font-size:.8rem" onclick="markPaid('${p.id}','${e.id}')">Ödendi</button>`:''}
              <button type="button" class="btn btn-secondary" style="padding:6px 10px;font-size:.8rem" onclick="editVeresiyeEntry('${p.id}','${e.id}')">Düzenle</button>
              <button type="button" class="btn btn-danger" style="padding:6px 10px;font-size:.8rem" onclick="deleteEntry('${p.id}','${e.id}')">Sil</button>
            </div>
          </div>`;
        });
        html+=`</div></div></div>`;
      });
      el.innerHTML=html;
      bindVeresiyeSwipe();
    }

    function markPaid(pid,eid){
      const p=veresiye.find(x=>x.id===pid);
      if(!p) return;
      const e=p.entries.find(x=>x.id===eid);
      if(!e||e.paid) return;
      e.paid=true;
      // Ödenen tutarı satışlara da ekle (tahsilat)
      salesHistory.unshift({id:id(),date:new Date().toISOString(),total:e.total,items:e.items||[],fromVeresiye:true,person:p.name});
      saveSales();
      saveVeresiye();
      renderVeresiye();
      saleSuccessSound();
      toast('Ödendi · '+p.name+' · '+money(e.total));
    }

    function deleteEntry(pid,eid){
      try{
        const p=veresiye.find(x=>String(x.id)===String(pid));
        if(!p){ toast('Kişi bulunamadı'); return; }
        const idx=(p.entries||[]).findIndex(x=>String(x.id)===String(eid));
        if(idx<0){ toast('Kayıt bulunamadı'); return; }
        if(!confirm('Bu veresiye kaydı silinsin mi?')) return;
        const entry = p.entries[idx];
        deletedVeresiyeStack.push({type:'entry',personId:pid,entry:entry});
        p.entries.splice(idx,1);
        // Ödenmemiş ve stok düşülmüş veresiyeyi silince stoku geri ekle
        // (elle borç / zaten ödenmiş kayıt stok düşürmemişti veya tahsilatta zaten düşmüştü)
        if(entry && !entry.paid && !entry.manual){
          adjustStockFromSaleItems(entry.items, +1);
        }
        saveVeresiye();
        renderVeresiye();
        toast('Kayıt silindi' + (entry && !entry.paid && !entry.manual ? ' · Stok geri eklendi' : ''));
      }catch(err){ console.error(err); toast('Silinemedi'); }
    }

    function editVeresiyeEntry(pid, eid){
      const p = veresiye.find(x => x.id === pid);
      if(!p) return;
      const e = (p.entries||[]).find(x => x.id === eid);
      if(!e) return;
      stopLiveScanner();
      window._editVPid = pid;
      window._editVEid = eid;
      window._editVItems = JSON.parse(JSON.stringify(e.items && e.items.length ? e.items : [{name:'', qty:1, price:0}]));
      document.getElementById('modal').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <h2 style="margin:0">Satış Düzenle</h2>
          <button class="btn btn-secondary" style="padding:6px 12px" onclick="closeModal()">Kapat</button>
        </div>
        <div class="meta" style="margin-bottom:10px">${p.name}</div>
        <div id="editVItems"></div>
        <button class="btn btn-secondary btn-block" style="margin:10px 0" onclick="addEditVItem()">+ Ürün Ekle</button>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:10px;border:1px solid var(--border);margin-bottom:12px">
          <strong>Toplam</strong>
          <strong id="editVTotal" style="color:#fbbf24;font-size:1.15rem">0,00 ₺</strong>
        </div>
        <button class="btn btn-primary btn-block" onclick="saveVeresiyeEntry()">Kaydet</button>
        <button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="closeModal()">İptal</button>`;
      document.getElementById('modalBg').classList.add('show');
      renderEditVItems();
    }

    function renderEditVItems(){
      const box = document.getElementById('editVItems');
      if(!box || !window._editVItems) return;
      box.innerHTML = window._editVItems.map((it, idx) => {
        const n = String(it.name||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
        return `<div style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px">
          <div class="form-group" style="margin-bottom:8px">
            <label>Ürün</label>
            <input value="${n}" oninput="window._editVItems[${idx}].name=this.value">
          </div>
          <div class="form-row">
            <div class="form-group" style="margin-bottom:0">
              <label>Adet</label>
              <input type="number" min="1" step="1" value="${it.qty||1}" oninput="window._editVItems[${idx}].qty=parseInt(this.value)||1;updateEditVTotal()">
            </div>
            <div class="form-group" style="margin-bottom:0">
              <label>Fiyat (₺)</label>
              <input type="number" min="0" step="0.01" value="${it.price||0}" oninput="window._editVItems[${idx}].price=parseFloat(this.value)||0;updateEditVTotal()">
            </div>
          </div>
          <button class="btn btn-danger" style="padding:4px 10px;font-size:.75rem;margin-top:8px" onclick="removeEditVItem(${idx})">Satırı Sil</button>
        </div>`;
      }).join('') || '<div class="empty" style="padding:16px">Ürün yok</div>';
      updateEditVTotal();

    function bindVeresiyeSwipe(){
      document.querySelectorAll('.v-swipe-wrap').forEach(wrap => {
        const contentEl = wrap.querySelector('.v-swipe-content');
        const delBtn = wrap.querySelector('.v-swipe-del');
        if(!contentEl) return;
        if(contentEl._swipeBound) return;
        contentEl._swipeBound = true;
        let startX=0, startY=0, curX=0, dragging=false, opened=false, axis=null;
        const MAX=96;

        function setX(x, anim){
          contentEl.style.transition = anim ? 'transform .55s cubic-bezier(.22,.61,.36,1)' : 'none';
          contentEl.style.transform = 'translate3d(' + x + 'px,0,0)';
          curX = x;
        }

        function onStart(x,y){
          startX=x; startY=y; axis=null; dragging=true;
          contentEl.style.transition='none';
        }
        function onMove(x,y,e){
          if(!dragging) return;
          const dx=x-startX, dy=y-startY;
          if(axis===null){
            if(Math.abs(dx)<8 && Math.abs(dy)<8) return;
            axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
          }
          if(axis==='v'){ dragging=false; return; }
          if(e && e.cancelable) e.preventDefault();
          // yavaş kayma: parmağın %55'i kadar hareket
          const slowDx = dx * 0.55;
          let nx = (opened ? -MAX : 0) + slowDx;
          if(nx>0) nx=0;
          if(nx<-MAX*1.25) nx=-MAX*1.25;
          setX(nx, false);
        }
        function onEnd(){
          if(!dragging && axis!=='h'){ dragging=false; axis=null; return; }
          dragging=false;
          if(curX <= -MAX*1.1){
            setX(0, true);
            opened=false;
            const pid = wrap.getAttribute('data-pid');
            doDeletePerson(pid, true);
            axis=null;
            return;
          }
          if(curX <= -MAX*0.35){
            setX(-MAX, true);
            opened=true;
          } else {
            setX(0, true);
            opened=false;
          }
          axis=null;
        }

        contentEl.addEventListener('touchstart', e=>{
          if(e.touches.length!==1) return;
          onStart(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive:true});
        contentEl.addEventListener('touchmove', e=>{
          if(e.touches.length!==1) return;
          onMove(e.touches[0].clientX, e.touches[0].clientY, e);
        }, {passive:false});
        contentEl.addEventListener('touchend', onEnd);
        contentEl.addEventListener('touchcancel', onEnd);

        contentEl.addEventListener('mousedown', e=>{
          onStart(e.clientX, e.clientY);
          const mm = ev => onMove(ev.clientX, ev.clientY, ev);
          const mu = () => { onEnd(); window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); };
          window.addEventListener('mousemove', mm);
          window.addEventListener('mouseup', mu);
        });

        if(delBtn){
          delBtn.onclick = function(ev){
            ev.preventDefault();
            ev.stopPropagation();
            const pid = wrap.getAttribute('data-pid');
            doDeletePerson(pid, false);
          };
        }
      });
    }

            html+=`<div class="sale-item">

      deletedSalesStack.push(removed);
      // Gerçek satışsa stoku geri ekle (elle / veresiye tahsilatı stok düşürmemişti)
      if(saleAffectsStock(removed)){
        adjustStockFromSaleItems(removed.items, +1);

      saveSales(); renderSalesSheet(); toast('Satış silindi' + (saleAffectsStock(removed) ? ' · Stok geri eklendi' : ''));

      salesHistory.push(restored);
      salesHistory.sort((a,b)=>new Date(b.date)-new Date(a.date));
      // Geri alınca stoku tekrar düş (sadece gerçek satışlarda)
      if(saleAffectsStock(restored)){
        adjustStockFromSaleItems(restored.items, -1);

      saveSales(); renderSalesSheet(); toast('Geri alındı' + (saleAffectsStock(restored) ? ' · Stok düşüldü' : ''));
    }

    function startLiveScanner(){
      const st=document.getElementById('scanStatus');

      stopLiveScanner();
      const oldBtn=document.getElementById('camStartBtn'); if(oldBtn) oldBtn.remove();
      const config={
        // Hızlı kantin taraması: daha yüksek tarama frekansı + küçük ROI
        fps: 30,
        qrbox: (w,h)=>({ width: Math.floor(w*0.94), height: Math.floor(Math.min(h*0.52, 260)) }),
        aspectRatio: 1.777,
        disableFlip: true,
        videoConstraints: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920, max: 1920 },
          height: { ideal: 1080, max: 1080 },
          frameRate: { ideal: 30, max: 30 },
          focusMode: 'continuous'
        },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.ITF,
          Html5QrcodeSupportedFormats.CODABAR
        ],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      };
      const onSuccess=(code)=>{
        if(!code) return;
        const now=Date.now();
        // Aynı barkod kameranın önünde kaldığında tekrar tekrar ekleme;
        // farklı barkodlar ise beklemeden okunur.
        if(code===lastCode && now-lastScanTime<350) return;
        lastCode=code; lastScanTime=now;
        onBarcodeDetected(code);
      };
      const onReady=()=>{
        // iPhone destekliyorsa gerçek optik/dijital kamera zoomunu uygula.
        // Böylece barkod görüntüde daha yakın görünür; desteklenmiyorsa normal kamerada kalır.
        try {
          const vid = document.querySelector('#liveScanner video');
          const track = vid && vid.srcObject && vid.srcObject.getVideoTracks ? vid.srcObject.getVideoTracks()[0] : null;
          const caps = track && track.getCapabilities ? track.getCapabilities() : null;
          if(track && caps && typeof caps.zoom === 'object' && caps.zoom.max) {
            const min = Number(caps.zoom.min || 1);
            const max = Number(caps.zoom.max || min);
            const target = Math.min(max, Math.max(min, 2.5));
            if(track.applyConstraints) track.applyConstraints({advanced:[{zoom:target}] }).catch(()=>{});
          }
        } catch(e) {}
        if(st){ st.textContent='Hazır · Yakın kamera · Sürekli okuma açık'; st.classList.add('active'); }
        const b=document.getElementById('camStartBtn'); if(b) b.remove();
        setTimeout(()=>{
          document.querySelectorAll('#liveScanner div').forEach(d=>{ try{ if(d.style) d.style.border='none'; }catch(e){} });
        }, 400);
      };
      const showCamButton=(msg)=>{
        if(st) st.textContent=msg||'Kamera izni gerekli';
        if(document.getElementById('camStartBtn')) return;
        const btn=document.createElement('button');
        btn.id='camStartBtn';
        btn.className='btn btn-primary';
        btn.style.cssText='position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;padding:16px 28px;font-size:1.05rem;border-radius:16px';
        btn.textContent='📷 Kamerayı Aç';
        btn.onclick=(e)=>{ e.preventDefault(); btn.textContent='Açılıyor...'; requestCamera(); };
        if(wrap) wrap.appendChild(btn);
      };
      /** Tele/uzak kamera ASLA; ultra-wide / yakın arka kamera tercih */
      const pickNearBackCamera = (cams) => {
        if(!cams || !cams.length) return null;
        const score = (label) => {
          const l = (label || '').toLowerCase();
          if(/front|ön|user|selfie|face/i.test(l)) return -1000;
          // Yakınlaştıran kamera öncelikli: 2x/3x/5x/tele varsa onu kullan.
          if(/tele|telephoto|2x|3x|5x|zoom/i.test(l)) return 500;
          let s = 0;
          if(/back|arka|rear|environment|world/i.test(l)) s += 60;
          if(/wide|geniş|main|ana|1x|back wide|arka wide/i.test(l) && !/ultra/i.test(l)) s += 80;
          if(/ultra\s*wide|ultrawide|ultra-wide|0\.5|macro|yakın|near/i.test(l)) s += 10;
          return s;
        };
        let best = null, bestS = -9999;
        cams.forEach(c => {
          const sc = score(c.label);
          if(sc > bestS){ bestS = sc; best = c; }
        });
        if(bestS <= 0){
          const nonFront = cams.filter(c => !/front|ön|user|selfie/i.test(c.label||''));
          const tele = nonFront.find(c => /tele|telephoto|zoom|2x|3x|5x/i.test(c.label||''));
          if(tele) return tele;
          const wide = nonFront.find(c => /wide|main|ana|1x/i.test(c.label||''));
          if(wide) return wide;
          return nonFront[0] || cams[0];
        }
        return best;
      };
      const startWithCam = (camIdOrConfig) => {
        const scanner = new Html5Qrcode('liveScanner', { verbose: false });
        liveScanner = scanner;
        return scanner.start(camIdOrConfig, config, onSuccess, ()=>{}).then(()=>{
          onReady();
          // iPhone/Safari destekliyorsa gerçek kamera zoom'unu uygula.
          // Böylece görüntü ekranda daha yakın görünür ve barkod uzaktan daha rahat yakalanır.
          setTimeout(()=>{
            try {
              const video = document.querySelector('#liveScanner video');
              const track = video && video.srcObject ? video.srcObject.getVideoTracks()[0] : null;
              if(!track || !track.getCapabilities || !track.applyConstraints) return;
              const caps = track.getCapabilities();
              if(typeof caps.zoom === 'object' && typeof caps.zoom.max === 'number'){
                const target = Math.min(caps.max, Math.max(caps.min || 1, 2.2));
                track.applyConstraints({advanced:[{zoom:target}] }).catch(()=>{});
              }
            } catch(e) {}
          }, 350);
        });
      };
      const requestCamera = () => {
        // 1) Önce izin al (Safari etiketleri için şart)
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
          .then(tmp => {
            tmp.getTracks().forEach(t => t.stop());
            return Html5Qrcode.getCameras();
          })
          .then(cams => {
            if(!cams || !cams.length){
              return startWithCam({ facingMode: 'environment' });
            }
            const near = pickNearBackCamera(cams);
            if(st) st.textContent = 'Kamera: ' + ((near && near.label) || 'arka yakın');
            return startWithCam(near ? near.id : { facingMode: 'environment' });
          })
          .catch(() => {
            startWithCam({ facingMode: 'environment' }).catch(() => showCamButton('İzin verin · Tekrar deneyin'));
          });
      };
      requestCamera();
    }
    function stopLiveScanner(){
      if(!liveScanner) return;
      const sc = liveScanner;
      liveScanner = null;
      try {
        if (typeof sc.getState === 'function') {
          const state = sc.getState();
          if (state === 2 || state === 3) {
            sc.stop().catch(()=>{}).finally(()=>{
              const el = document.getElementById('liveScanner');
              if(el) el.innerHTML = '';
            });
            return;
          }
        } else {
          sc.stop().catch(()=>{});
        }
      } catch(e) {}
      const el = document.getElementById('liveScanner');
      if(el) el.innerHTML = '';
    }

    function onBarcodeDetected(code){
      // Kamera AÇIK kalsın (App Store uygulaması gibi sürekli okuma)
      beep();
      lastCode = code;
      lastScanTime = Date.now();
      let p = products.find(x => x.barcode === code);
      if(!p){
        // Bilinmeyen ürün: kamerayı durdur, sor
        stopLiveScanner();
        if(confirm(`"${code}" kayıtlı değil.\nYeni ürün ekle?`)){
          openModal();
          setTimeout(()=>{ const b=document.getElementById('b'); if(b) b.value=code; }, 150);
        } else {
          setTimeout(()=>{ if(tab==='sales') startLiveScanner(); }, 400);
        }
        return;
      }
      // Kayıtlı ürün: sepete ekle, kamera kesintisiz devam
      addCart(p);
      const st=document.getElementById('scanStatus');
      if(st){ st.textContent='✓ '+(p.name||'Eklendi')+'  ·  SONRAKİ BARKOD'; st.classList.add('active'); }
    }
    function manualSales(){ const code=prompt('Barkodu girin:'); if(code) onBarcodeDetected(code.trim()); }
    function addCart(p){
      // Stok her zaman sayı olarak kontrol edilsin
      const stok = Math.max(0, parseInt(p.stock, 10) || 0);
      p.stock = stok; // bellekte de düzelt
      if(stok <= 0){
        toast('Stok bitmiş · Stok girişi için açılıyor');
        openModal(p.id);
        return;
      }
      const ex = cart.find(c => c.id === p.id);
      if(ex){
        if(ex.qty >= stok){ toast('Stok yetersiz · Stok güncelle'); openModal(p.id); return; }
        ex.qty++;
      } else {
        cart.push({id:p.id, name:p.name, price:Number(p.price)||0, qty:1});
      }
      updateCartUI();
    }

        </div>

    let productScanner = null;
    function scanBarcodeForProduct(){
      if(typeof Html5Qrcode === 'undefined'){ toast('Kamera kütüphanesi yok'); return; }
      stopProductScan();
      const area = document.getElementById('productScanArea');
      const box = document.getElementById('productScanner');
      const st = document.getElementById('productScanStatus');
      if(!area || !box){ toast('Tarama alanı yok'); return; }
      box.innerHTML = '';
      area.style.display = 'block';
      if(st) st.textContent = 'Kamera açılıyor...';
      setTimeout(()=>{ area.scrollIntoView({ behavior:'smooth', block:'center' }); }, 100);

      const onCode = (code) => {
        const b = document.getElementById('b');
        if(b) b.value = code;
        stopProductScan();
        beep();
        toast('Barkod alındı');
      };
      const cfg = {
        fps: 30,
        qrbox: { width: 300, height: 120 },
        aspectRatio: 1.777,
        disableFlip: true,
        videoConstraints: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920, max: 1920 },
          height: { ideal: 1080, max: 1080 },
          frameRate: { ideal: 30, max: 30 },
          focusMode: 'continuous'
        }
      };

      const startWith = (cam) => {
        productScanner = new Html5Qrcode('productScanner', { verbose: false });
        return productScanner.start(cam, cfg, onCode, ()=>{}).then(()=>{
          if(st) st.textContent = 'Barkodu kameraya tutun';
          setTimeout(()=>{
            const vid = box.querySelector('video');
            if(vid){
              vid.style.width = '100%';
              vid.style.height = '260px';
              vid.style.objectFit = 'cover';
              vid.style.display = 'block';
            }
          }, 300);
        });
      };

      // Önce izin, sonra yakın (ultra-wide) arka kamera
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
        .then(tmp => {
          tmp.getTracks().forEach(t => t.stop());
          return Html5Qrcode.getCameras();
        })
        .then(cams => {
          if(!cams || !cams.length) return startWith({ facingMode: 'environment' });
          // Tele hariç, ultra-wide / wide tercih
          const score = (label) => {
            const l = (label || '').toLowerCase();
            if(/front|ön|user|selfie/i.test(l)) return -1000;
            if(/tele|zoom|2x|3x|5x/i.test(l)) return -500;
            let s = 0;
            if(/ultra\s*wide|ultrawide|0\.5|macro|yakın|near/i.test(l)) s += 100;
            if(/wide|geniş|dual wide/i.test(l)) s += 50;
            if(/back|arka|rear|environment/i.test(l)) s += 30;
            return s;
          };
          let best = cams[0], bestS = -9999;
          cams.forEach(c => { const sc = score(c.label); if(sc > bestS){ bestS = sc; best = c; } });
          if(st) st.textContent = 'Kamera: ' + (best.label || 'yakın arka');
          return startWith(best.id);
        })
        .catch(() => {
          startWith({ facingMode: 'environment' }).catch(()=>{
            if(st) st.textContent='İzin gerekli'; toast('Kamera izni gerekli');
          });
        });
    }
    function stopProductScan(){
      const area = document.getElementById('productScanArea');
      if(area) area.style.display = 'none';
      if(productScanner){
        const sc = productScanner;
        productScanner = null;
        try {
          if (typeof sc.getState === 'function') {
            const state = sc.getState();
            if (state === 2 || state === 3) {
              sc.stop().catch(()=>{});
            }
          } else if (typeof sc.stop === 'function') {
            sc.stop().catch(()=>{});
          }
        } catch(e) {}
      }
      const box = document.getElementById('productScanner');
      if(box) box.innerHTML = '';
    }

    function saveProduct(){
      const name=document.getElementById('n').value.trim(); if(!name){toast('Ürün adı gerekli');return;}
      const barcode=document.getElementById('b').value.trim();
      const price=parseFloat(document.getElementById('pr').value)||0;
      const stock=Math.max(0, parseInt(document.getElementById('st').value, 10) || 0);
      if(editId){ const p=products.find(x=>x.id===editId); p.name=name;p.barcode=barcode;p.price=price;p.stock=stock; }
      else products.push({id:id(),name,barcode,price,stock});
      products.sort((a,b)=>(a.name||'').localeCompare(b.name||'','tr',{sensitivity:'base'}));
      save(); closeModal(); render(); toast(editId?'Güncellendi':'Eklendi');
    }
    function delProduct(){
      if(!confirm('Silinsin mi?')) return;
      const removedId = editId;
      products = products.filter(p=>p.id!==removedId);
      // Sepetteki aynı ürünü de temizle (hayalet satır kalmasın)
      cart = cart.filter(c=>c.id!==removedId);
      save();
      closeModal();
      render();
      updateCartUI();
      toast('Silindi');
    }

    function exportExcel(){
      if(typeof XLSX === 'undefined'){
        // Yedek: CSV
        let csv='Barkod,Ürün Adı,Fiyat,Stok\n';
        products.forEach(p=>{csv+=`"${p.barcode||''}","${(p.name||'').replace(/"/g,'""')}",${p.price||0},${p.stock||0}\n`;});
        const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
        const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url;
        a.download='kantin-'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); URL.revokeObjectURL(url);
        markBackupDone(); toast('CSV indirildi · Yedek kaydedildi'); return;
      }
      const wb = XLSX.utils.book_new();

      // 1) ÜRÜNLER
      const urunRows = [['Barkod','Ürün Adı','Fiyat (₺)','Stok','Stok Değeri (₺)']];
      products.forEach(p=>{
        const fiyat=Number(p.price)||0, stok=Number(p.stock)||0;
        urunRows.push([p.barcode||'', p.name||'', fiyat, stok, Math.round(fiyat*stok*100)/100]);
      });
      const wsUrun = XLSX.utils.aoa_to_sheet(urunRows);
      wsUrun['!cols'] = [{wch:16},{wch:28},{wch:12},{wch:10},{wch:14}];
      XLSX.utils.book_append_sheet(wb, wsUrun, 'Ürünler');

      // 2) SATIŞLAR (fiş özeti)
      const satisRows = [['Tarih','Saat','Toplam (₺)','Ürün Sayısı','Kaynak','Müşteri']];
      salesHistory.forEach(s=>{
        const d=new Date(s.date);
        const tarih=d.toLocaleDateString('tr-TR');
        const saat=d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
        const kaynak=s.fromVeresiye?'Veresiye Tahsilat':(s.manual?'Elle Giriş':'Nakit Satış');
        satisRows.push([tarih, saat, Number(s.total)||0, (s.items||[]).length, kaynak, s.person||'']);
      });
      const wsSatis = XLSX.utils.aoa_to_sheet(satisRows);
      wsSatis['!cols'] = [{wch:14},{wch:8},{wch:12},{wch:12},{wch:16},{wch:18}];
      XLSX.utils.book_append_sheet(wb, wsSatis, 'Satışlar');

      // 3) SATIŞ KALEMLERİ
      const kalemRows = [['Tarih','Saat','Ürün','Adet','Birim Fiyat (₺)','Satır Tutarı (₺)','Kaynak','Müşteri']];
      salesHistory.forEach(s=>{
        const d=new Date(s.date);
        const tarih=d.toLocaleDateString('tr-TR');
        const saat=d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
        const kaynak=s.fromVeresiye?'Veresiye Tahsilat':(s.manual?'Elle Giriş':'Nakit Satış');
        (s.items||[]).forEach(it=>{
          const adet=Number(it.qty)||0, fiyat=Number(it.price)||0;
          kalemRows.push([tarih, saat, it.name||'', adet, fiyat, Math.round(adet*fiyat*100)/100, kaynak, s.person||'']);
        });
      });
      const wsKalem = XLSX.utils.aoa_to_sheet(kalemRows);
      wsKalem['!cols'] = [{wch:14},{wch:8},{wch:24},{wch:8},{wch:14},{wch:14},{wch:16},{wch:18}];
      XLSX.utils.book_append_sheet(wb, wsKalem, 'Satış Kalemleri');

      // 4) VERESİYE (kişi özeti)
      const verRows = [['Sıra','Müşteri','Açık Bakiye (₺)','Kayıt Sayısı','Ödenmemiş','Ödenmiş']];
      const sortedV=[...veresiye].sort((a,b)=>(a.name||'').localeCompare(b.name||'','tr',{sensitivity:'base'}));
      sortedV.forEach((p,i)=>{
        const entries=p.entries||[];
        const acik=entries.filter(e=>!e.paid).reduce((s,e)=>s+(Number(e.total)||0),0);
        const odenmemis=entries.filter(e=>!e.paid).length;
        const odenmis=entries.filter(e=>e.paid).length;
        verRows.push([i+1, p.name||'', Math.round(acik*100)/100, entries.length, odenmemis, odenmis]);
      });
      const wsVer = XLSX.utils.aoa_to_sheet(verRows);
      wsVer['!cols'] = [{wch:6},{wch:22},{wch:14},{wch:12},{wch:12},{wch:10}];
      XLSX.utils.book_append_sheet(wb, wsVer, 'Veresiye');

      // 5) VERESİYE KALEMLERİ
      const verKalem = [['Müşteri','Tarih','Saat','Durum','Toplam (₺)','Ürün / Açıklama','Adet','Birim Fiyat (₺)','Satır Tutarı (₺)','Elle Giriş']];
      sortedV.forEach(p=>{
        (p.entries||[]).forEach(e=>{
          const d=new Date(e.date);
          const tarih=d.toLocaleDateString('tr-TR');
          const saat=d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
          const durum=e.paid?'Ödendi':'Açık';
          const items=e.items||[{name:'—',qty:1,price:e.total}];
          items.forEach(it=>{
            const adet=Number(it.qty)||0, fiyat=Number(it.price)||0;
            verKalem.push([p.name||'', tarih, saat, durum, Number(e.total)||0, it.name||'', adet, fiyat, Math.round(adet*fiyat*100)/100, e.manual?'Evet':'Hayır']);
          });
        });
      });
      const wsVK = XLSX.utils.aoa_to_sheet(verKalem);
      wsVK['!cols'] = [{wch:18},{wch:14},{wch:8},{wch:10},{wch:12},{wch:24},{wch:8},{wch:14},{wch:14},{wch:10}];
      XLSX.utils.book_append_sheet(wb, wsVK, 'Veresiye Kalemleri');

      // 6) ÖZET
      const stokDeger=products.reduce((s,p)=>s+(Number(p.price)||0)*(Number(p.stock)||0),0);
      const stokAdet=products.reduce((s,p)=>s+(Number(p.stock)||0),0);
      const satis=totalSales();
      const veres=totalVeresiye();
      const ozet = [
        ['KANTİN — Özet Rapor'],
        ['Tarih', new Date().toLocaleString('tr-TR')],
        [],
        ['Bölüm','Tutar / Değer'],
        ['Satış Toplamı (₺)', Math.round(satis*100)/100],
        ['Veresiye Açık Bakiye (₺)', Math.round(veres*100)/100],
        ['Satış + Veresiye (₺)', Math.round((satis+veres)*100)/100],
        ['Stok Fiyat Toplamı (₺)', Math.round(stokDeger*100)/100],
        [],
        ['Ürün Çeşidi', products.length],
        ['Toplam Stok Adedi', stokAdet],
        ['Satış Kaydı', salesHistory.length],
        ['Veresiye Kişisi', veresiye.length],
        ['Açık Borçlu Kişi', veresiye.filter(v=>personBalance(v)>0).length]
      ];
      const wsOzet = XLSX.utils.aoa_to_sheet(ozet);
      wsOzet['!cols'] = [{wch:28},{wch:18}];
      XLSX.utils.book_append_sheet(wb, wsOzet, 'Özet');

      const fname = 'kantin-'+new Date().toISOString().slice(0,10)+'.xlsx';
      XLSX.writeFile(wb, fname);
      markBackupDone(); toast('Excel indirildi · 6 sayfa · Yedek kaydedildi');
    }
    function importExcel(e){
      const file=e.target.files[0]; if(!file) return;
      const name=(file.name||'').toLowerCase();
      const reader=new FileReader();
      reader.onload=ev=>{
        try{
          let rows=[];
          if(name.endsWith('.xlsx')||name.endsWith('.xls')||(typeof XLSX!=='undefined' && ev.target.result instanceof ArrayBuffer)){
            if(typeof XLSX==='undefined'){ toast('Excel kütüphanesi yüklenemedi'); return; }
            const data=new Uint8Array(ev.target.result);
            const wb=XLSX.read(data,{type:'array'});
            // Ürünler sayfasını tercih et, yoksa ilk sayfa
            const sheetName = wb.SheetNames.find(n=>/ürün|urun|product/i.test(n)) || wb.SheetNames[0];
            rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:''});
          } else {
            const text=ev.target.result;
            rows=text.split(/\r?\n/).filter(l=>l.trim()).map(line=>{
              const cols=line.match(/(".*?"|[^,;]+)/g)||[];
              return cols.map(c=>String(c).replace(/^"|"$/g,'').trim());
            });
          }
          if(!rows.length){ toast('Dosya boş'); return; }
          // Başlık satırını atla
          let start=0;
          const h=(rows[0]||[]).map(x=>String(x).toLowerCase()).join(' ');
          if(/barkod|ürün|urun|ad|fiyat|stok|name|price/.test(h)) start=1;
          let added=0;
          for(let i=start;i<rows.length;i++){
            const cols=rows[i]; if(!cols||cols.length<2) continue;
            // Esnek kolon: Barkod, Ad, Fiyat, Stok
            let barcode='', pname='', price=0, stock=0;
            if(cols.length>=4){
              barcode=String(cols[0]||'').trim();
              pname=String(cols[1]||'').trim();
              price=parseFloat(String(cols[2]).replace(',','.'))||0;
              stock=Math.max(0, parseInt(cols[3], 10) || 0);
            } else {
              pname=String(cols[0]||'').trim();
              price=parseFloat(String(cols[1]).replace(',','.'))||0;
              stock=Math.max(0, parseInt(cols[2], 10) || 0);
            }
            if(!pname) continue;
            let existing=null;
            if(barcode) existing=products.find(p=>p.barcode&&p.barcode===barcode);
            if(!existing) existing=products.find(p=>p.name&&p.name.toLowerCase()===pname.toLowerCase());
            if(existing){ existing.name=pname; if(barcode) existing.barcode=barcode; existing.price=price; existing.stock=stock; }
            else products.push({id:id(), name:pname, barcode, price, stock});
            added++;
          }
          products.sort((a,b)=>(a.name||'').localeCompare(b.name||'','tr',{sensitivity:'base'}));
          save(); render(); toast(added+' ürün yüklendi');
        }catch(err){ console.error(err); toast('Dosya okunamadı'); }
      };
      if(name.endsWith('.xlsx')||name.endsWith('.xls')) reader.readAsArrayBuffer(file);
      else reader.readAsText(file);
      e.target.value='';
    }

    document.querySelector('.tabs').onclick=e=>{
      if(e.target.tagName==='BUTTON'){ document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active')); e.target.classList.add('active'); tab=e.target.dataset.tab; render(); }
    };
    document.getElementById('salesSheet').onclick=e=>{if(e.target.id==='salesSheet') closeSales();};
    document.getElementById('veresiyeSheet').onclick=e=>{if(e.target.id==='veresiyeSheet') closeVeresiye();};
    document.getElementById('toplamSheet').onclick=e=>{if(e.target.id==='toplamSheet') closeToplam();};
    document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg') closeModal();};
    // Sayfa kapanırken / arka plana giderken her şeyi kaydet
    function onPageExit(){
      try {
        stopLiveScanner();
        saveAll();
      } catch(e){}
    }
    window.addEventListener('beforeunload', onPageExit);
    window.addEventListener('pagehide', onPageExit);
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState === 'hidden') onPageExit();
    });
    // iOS Safari için ekstra
    window.addEventListener('freeze', onPageExit);
    try{ mergeVeresiyeNames(); saveVeresiye(); save(); }catch(e){}
    // PWA / offline cache
    if('serviceWorker' in navigator){
      window.addEventListener('load', function(){
        navigator.serviceWorker.register('./sw.js').catch(function(err){ console.warn('SW kayıt hatası', err); });
      });
    }
    render();
  </script>
