<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>KANTİN</title>
<style>
  :root {
    --bg: #0b1120; --card: #1e293b; --card2: #334155;
    --primary: #3b82f6; --primary-glow: rgba(59,130,246,.4);
    --success: #22c55e; --danger: #ef4444; --warn: #f59e0b;
    --text: #f1f5f9; --muted: #94a3b8; --border: #334155;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:100px}
  .header{background:linear-gradient(135deg,#0f172a,#1e3a8a);padding:16px 16px 14px;position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(59,130,246,.25)}
  .header h1{font-size:1.25rem;font-weight:700}
  .header p{font-size:.75rem;color:var(--muted);margin-top:2px}
  .tabs{display:flex;gap:8px;margin-top:12px}
  .tabs button{flex:1;padding:11px;border:none;border-radius:12px;background:rgba(255,255,255,.08);color:var(--muted);font-weight:600;font-size:.9rem}
  .tabs button.active{background:var(--primary);color:#fff;box-shadow:0 0 18px var(--primary-glow)}
  .container{padding:14px;max-width:480px;margin:0 auto}
  .search{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font-size:1rem;background:var(--card);color:var(--text);margin-bottom:12px;outline:none}
  .card{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border)}
  .card h3{font-size:.95rem;font-weight:600}
  .meta{font-size:.78rem;color:var(--muted);margin-top:2px}
  .price{font-weight:700;color:#60a5fa;font-size:1.05rem}
  .stock{font-size:.75rem;padding:2px 8px;border-radius:20px;display:inline-block;margin-top:3px;font-weight:600}
  .stock-ok{background:rgba(34,197,94,.15);color:#4ade80}
  .stock-low{background:rgba(234,179,8,.15);color:#facc15}
  .stock-zero{background:rgba(239,68,68,.15);color:#f87171}
  .total-bar{background:linear-gradient(135deg,#1e3a8a,#2563eb);border-radius:14px;padding:14px 16px;margin-top:14px;font-weight:700;display:flex;justify-content:space-between;box-shadow:0 4px 18px rgba(30,64,175,.3)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border:none;border-radius:12px;font-weight:600;font-size:.95rem;cursor:pointer}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-success{background:var(--success);color:#fff}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-warn{background:var(--warn);color:#111}
  .btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}
  .btn-block{width:100%}
  .fab{position:fixed;bottom:100px;right:16px;width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:1.7rem;box-shadow:0 6px 22px var(--primary-glow);z-index:40}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
  .modal-bg.show{display:flex}
  .modal{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 16px;max-height:94vh;overflow-y:auto;border-top:1px solid var(--border)}
  .modal h2{font-size:1.15rem;margin-bottom:16px}
  .form-group{margin-bottom:13px}
  .form-group label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:5px}
  .form-group input,.form-group select{width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;font-size:1rem;background:var(--bg);color:var(--text);outline:none}
  .form-row{display:flex;gap:10px}
  .form-row .form-group{flex:1}
  .cart-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
  .cart-total{font-size:1.45rem;font-weight:700;text-align:right;margin:16px 0;color:#60a5fa}
  .empty{text-align:center;padding:40px 16px;color:var(--muted)}
  .toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:11px 18px;border-radius:12px;font-size:.9rem;z-index:200;opacity:0;transition:.25s;pointer-events:none;border:1px solid var(--border)}
  .toast.show{opacity:1}
  .bottom-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(15,23,42,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:10px 10px;display:flex;gap:6px;z-index:30;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .bottom-bar button{flex:1;padding:10px 3px;border-radius:11px;border:none;font-weight:600;font-size:.8rem;background:var(--card2);color:var(--text)}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
  .sheet.show{display:flex}
  .sheet-content{background:var(--card);width:100%;max-width:480px;border-radius:16px 16px 0 0;max-height:96vh;height:96vh;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
  .sheet-content h2{font-size:1.15rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .month-header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:11px 14px;border-radius:11px;margin:14px 0 8px;font-weight:700;display:flex;justify-content:space-between;cursor:pointer}
  .day-header{font-weight:600;font-size:.85rem;color:var(--muted);margin:10px 0 6px;padding:8px 10px;background:var(--bg);border-radius:10px;border:1px solid var(--border);display:flex;justify-content:space-between;cursor:pointer}
  .sale-item{background:var(--bg);border-radius:10px;padding:11px 13px;margin-bottom:6px;border:1px solid var(--border)}
  .scanner-wrap{background:#000;border-radius:16px;overflow:hidden;margin-bottom:12px;position:relative;height:260px}
  #liveScanner{width:100%;height:100%}
  #liveScanner video{object-fit:cover !important;width:100% !important;height:100% !important}
  .scan-line{position:absolute;left:8%;right:8%;top:50%;height:2px;background:#facc15;box-shadow:0 0 10px #facc15,0 0 20px rgba(250,204,21,.5);z-index:5;pointer-events:none;border-radius:2px;animation:scanPulse 1.2s ease-in-out infinite}
  @keyframes scanPulse{0%,100%{opacity:.7}50%{opacity:1}}
  .scanner-status{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;font-size:.78rem;padding:5px 12px;border-radius:20px;z-index:6;white-space:nowrap}
  .scanner-status.active{background:rgba(34,197,94,.85)}
  .v-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .v-bal{font-size:1.15rem;font-weight:700;color:#fbbf24}
  .summary-row{display:flex;gap:8px;margin-bottom:12px}
  .summary-box{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
  .summary-box .lbl{font-size:.75rem;color:var(--muted)}
  .summary-box .val{font-size:1.05rem;font-weight:700;margin-top:4px}
</style>
</head>
<body>
  <div class="header">
    <h1>KANTİN</h1>
    <p>Offline · Hızlı Satış</p>
    <div class="tabs">
      <button data-tab="list">Ürünler</button>
      <button class="active" data-tab="sales">Satış</button>
    </div>
  </div>

  <div class="container" id="content"></div>
  <button class="fab" id="fab" style="display:none">+</button>

  <div class="bottom-bar">
    <button onclick="openSales()">Satışlar</button>
    <button onclick="openVeresiye()">Veresiye</button>
    <button onclick="openToplam()">Toplam</button>
    <button onclick="toggleDataMenu()" id="dataMenuBtn">♻️</button>
  </div>
  <div id="dataMenu" style="display:none;position:fixed;bottom:70px;right:12px;z-index:40;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px;box-shadow:0 8px 30px rgba(0,0,0,.4);min-width:150px">
    <button class="btn btn-secondary btn-block" style="margin-bottom:6px" onclick="exportExcel();hideDataMenu()">Excel İndir</button>
    <button class="btn btn-secondary btn-block" onclick="document.getElementById('excelInput').click();hideDataMenu()">Excel Yükle</button>
  </div>
  <input type="file" id="excelInput" accept=".csv,text/csv" style="display:none" onchange="importExcel(event)">

  <div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
  <div class="sheet" id="salesSheet"><div class="sheet-content" id="salesContent"></div></div>
  <div class="sheet" id="veresiyeSheet"><div class="sheet-content" id="veresiyeContent"></div></div>
  <div class="sheet" id="toplamSheet"><div class="sheet-content" id="toplamContent"></div></div>
  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    let products = JSON.parse(localStorage.getItem('bf_stok') || '[]');
    let salesHistory = JSON.parse(localStorage.getItem('bf_sales') || '[]');
    let veresiye = JSON.parse(localStorage.getItem('bf_veresiye') || '[]'); // {id, name, entries:[{id,date,total,items,paid}], deleted?}
    let cart = [];
    let tab = 'sales';
    let liveScanner = null;
    let lastCode = '', lastScanTime = 0;
    let editId = null;
    let audioCtx = null;
    let deletedSalesStack = [];
    let deletedVeresiyeStack = [];

    function save(){ localStorage.setItem('bf_stok', JSON.stringify(products)); }
    function saveSales(){ localStorage.setItem('bf_sales', JSON.stringify(salesHistory)); }
    function saveVeresiye(){ localStorage.setItem('bf_veresiye', JSON.stringify(veresiye)); }
    function money(n){ return Number(n||0).toFixed(2).replace('.',',') + ' ₺'; }
    function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
    function id(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

    function personBalance(p){
      return (p.entries||[]).filter(e=>!e.paid).reduce((s,e)=>s+e.total,0);
    }
    function totalVeresiye(){ return veresiye.reduce((s,p)=>s+personBalance(p),0); }
    function totalSales(){ return salesHistory.reduce((s,x)=>s+x.total,0); }

    function beep(){
      try{
        if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        const o=audioCtx.createOscillator(), g=audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value=1800; o.type='square';
        g.gain.setValueAtTime(0.15, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.12);
        o.start(); o.stop(audioCtx.currentTime+0.12);
      }catch(e){}
      if(navigator.vibrate) navigator.vibrate(40);
    }
    function saleSuccessSound(){
      try{
        if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        const now=audioCtx.currentTime;
        [523.25,659.25,783.99].forEach((freq,i)=>{
          const o=audioCtx.createOscillator(), g=audioCtx.createGain();
          o.connect(g); g.connect(audioCtx.destination);
          o.type='sine'; o.frequency.value=freq;
          const t0=now+i*0.09;
          g.gain.setValueAtTime(0,t0);
          g.gain.linearRampToValueAtTime(0.12,t0+0.02);
          g.gain.exponentialRampToValueAtTime(0.001,t0+0.22);
          o.start(t0); o.stop(t0+0.25);
        });
      }catch(e){}
      if(navigator.vibrate) navigator.vibrate([30,40,30]);
    }

    function render(){
      const c=document.getElementById('content');
      const fab=document.getElementById('fab');
      stopLiveScanner();
      if(tab==='list'){
        fab.style.display='block';
        fab.onclick=()=>openModal();
        const totalValue=products.reduce((s,p)=>s+(p.price||0)*(p.stock||0),0);
        c.innerHTML=`
          <div class="summary-row">
            <div class="summary-box"><div class="lbl">Satış Toplamı</div><div class="val" style="color:#4ade80">${money(totalSales())}</div></div>
            <div class="summary-box"><div class="lbl">Veresiye Bakiye</div><div class="val" style="color:#fbbf24">${money(totalVeresiye())}</div></div>
          </div>
          <input class="search" placeholder="Ürün veya barkod ara..." oninput="filter(this.value)">
          <div id="list"></div>
          <div class="total-bar"><span>Stok Toplam Değeri</span><span>${money(totalValue)}</span></div>`;
        filter('');
      } else {
        fab.style.display='none';
        c.innerHTML=`
          <div class="scanner-wrap">
            <div id="liveScanner"></div>
            <div class="scan-line"></div>
            <div class="scanner-status" id="scanStatus">Kamera açılıyor...</div>
          </div>
          <div style="display:flex;gap:8px;margin-bottom:10px">
            <button class="btn btn-secondary btn-block" onclick="cart=[];updateCartUI()">Temizle</button>
            <button class="btn btn-secondary" onclick="manualSales()">Manuel</button>
          </div>
          <div id="cart"></div>
          <div id="cartExtra"></div>`;
        updateCartUI();
        startLiveScanner();
      }
    }

    function filter(q){
      q=(q||'').toLowerCase();
      const list=document.getElementById('list');
      const filtered=products.filter(p=>!q||p.name.toLowerCase().includes(q)||(p.barcode||'').includes(q));
      filtered.sort((a,b)=>(a.name||'').localeCompare(b.name||'','tr',{sensitivity:'base'}));
      if(!filtered.length){ list.innerHTML=`<div class="empty">${products.length?'Sonuç yok':'Henüz ürün yok'} </div>`; return; }
      list.innerHTML=filtered.map(p=>{
        const sc=p.stock<=0?'stock-zero':p.stock<=5?'stock-low':'stock-ok';
        const st=p.stock<=0?'Stok yok':p.stock+' adet';
        return `<div class="card" onclick="openModal('${p.id}')">
          <div><h3>${p.name}</h3><div class="meta">${p.barcode||'Barkod yok'}</div></div>
          <div style="text-align:right"><div class="price">${money(p.price)}</div><div class="stock ${sc}">${st}</div></div></div>`;
      }).join('');
    }

    function updateCartUI(){
      const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
      const cartEl=document.getElementById('cart');
      const extra=document.getElementById('cartExtra');
      if(!cartEl) return;
      cartEl.innerHTML=cart.length===0?'<div class="empty">Sepet boş<br>Barkodu sarı çizgiye tut</div>':
        cart.map((i,idx)=>`
          <div class="cart-item">
            <div><strong>${i.name}</strong><br><small style="color:var(--muted)">${money(i.price)} × ${i.qty}</small></div>
            <div style="display:flex;align-items:center;gap:7px">
              <button class="btn btn-secondary" style="padding:6px 11px" onclick="chg(${idx},-1)">−</button>
              <span style="min-width:20px;text-align:center;font-weight:600">${i.qty}</span>
              <button class="btn btn-secondary" style="padding:6px 11px" onclick="chg(${idx},1)">+</button>
              <button class="btn btn-danger" style="padding:6px 11px" onclick="cart.splice(${idx},1);updateCartUI()">×</button>
            </div>
          </div>`).join('');
      if(extra){
        extra.innerHTML=cart.length?`
          <div class="cart-total">${money(total)}</div>
          <button class="btn btn-success btn-block" onclick="finishSale()">Satışı Tamamla</button>
          <button class="btn btn-warn btn-block" style="margin-top:8px" onclick="openVeresiyeFromCart()">Veresiye Yaz</button>`:'';
      }
    }

    function chg(idx,d){
      const item=cart[idx];
      const p=products.find(x=>x.id===item.id);
      const nq=item.qty+d;
      if(nq<1) cart.splice(idx,1);
      else if(p&&nq>p.stock){ toast('Stok yetersiz'); return; }
      else item.qty=nq;
      updateCartUI();
    }

    function deductStock(){
      cart.forEach(item=>{
        const p=products.find(x=>x.id===item.id);
        if(p) p.stock=Math.max(0,(p.stock||0)-item.qty);
      });
      save();
    }

    function finishSale(){
      if(!cart.length) return;
      const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
      salesHistory.unshift({id:id(),date:new Date().toISOString(),total,items:cart.map(i=>({name:i.name,qty:i.qty,price:i.price}))});
      saveSales();
      deductStock();
      cart=[];
      updateCartUI();
      saleSuccessSound();
      toast('Satış tamamlandı · '+money(total));
    }

    // ===== VERESİYE =====
    function openVeresiyeFromCart(){
      if(!cart.length) return;
      stopLiveScanner();
      const names=veresiye.map(v=>v.name).sort((a,b)=>a.localeCompare(b,'tr',{sensitivity:'base'}));
      document.getElementById('modal').innerHTML=`
        <h2>Veresiye Yaz</h2>
        <div class="form-group"><label>Müşteri Adı</label>
          <input id="vName" list="vNames" placeholder="İsim yazın veya seçin">
          <datalist id="vNames">${names.map(n=>`<option value="${n}">`).join('')}</datalist>
        </div>
        <div style="background:var(--bg);border-radius:10px;padding:12px;margin-bottom:12px;border:1px solid var(--border)">
          <div style="font-weight:600;margin-bottom:6px">Sepet · ${money(cart.reduce((s,i)=>s+i.price*i.qty,0))}</div>
          ${cart.map(i=>`<div style="display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)"><span>${i.name} × ${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}
        </div>
        <button class="btn btn-warn btn-block" onclick="confirmVeresiye()">Veresiyeye Kaydet (Stok Düş)</button>
        <button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="closeModal()">İptal</button>`;
      document.getElementById('modalBg').classList.add('show');
    }

    function confirmVeresiye(){
      const name=(document.getElementById('vName').value||'').trim();
      if(!name){ toast('Müşteri adı gerekli'); return; }
      const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
      const entry={id:id(),date:new Date().toISOString(),total,items:cart.map(i=>({name:i.name,qty:i.qty,price:i.price})),paid:false};
      let person=veresiye.find(v=>v.name.toLowerCase()===name.toLowerCase());
      if(!person){ person={id:id(),name,entries:[]}; veresiye.unshift(person); }
      person.entries.unshift(entry);
      saveVeresiye();
      deductStock();
      cart=[];
      closeModal();
      updateCartUI();
      saleSuccessSound();
      toast('Veresiye yazıldı · '+name+' · '+money(total));
    }

    function openManualVeresiye(){
      const names = veresiye.map(v=>v.name).sort((a,b)=>a.localeCompare(b,'tr',{sensitivity:'base'}));
      document.getElementById('modal').innerHTML = `
        <h2>Elle Borç Girişi</h2>
        <div class="form-group"><label>Müşteri Adı</label>
          <input id="mvName" list="mvNames" placeholder="İsim yazın veya seçin">
          <datalist id="mvNames">${names.map(n=>`<option value="${n}">`).join('')}</datalist>
        </div>
        <div class="form-group"><label>Tutar (₺)</label>
          <input id="mvAmount" type="number" step="0.01" min="0" placeholder="0.00">
        </div>
        <div class="form-group"><label>Açıklama (isteğe bağlı)</label>
          <input id="mvNote" placeholder="Örn: 2 su, 1 poğaça">
        </div>
        <button class="btn btn-warn btn-block" onclick="confirmManualVeresiye()">Veresiyeye Kaydet</button>
        <button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="closeModal()">İptal</button>`;
      document.getElementById('modalBg').classList.add('show');
    }

    function confirmManualVeresiye(){
      const name = (document.getElementById('mvName').value||'').trim();
      const amount = parseFloat(document.getElementById('mvAmount').value)||0;
      const note = (document.getElementById('mvNote').value||'').trim();
      if(!name){ toast('Müşteri adı gerekli'); return; }
      if(amount <= 0){ toast('Geçerli tutar girin'); return; }
      const items = note ? [{name: note, qty: 1, price: amount}] : [{name: 'Elle giriş', qty: 1, price: amount}];
      const entry = {id: id(), date: new Date().toISOString(), total: amount, items, paid: false, manual: true};
      let person = veresiye.find(v => v.name.toLowerCase() === name.toLowerCase());
      if(!person){ person = {id: id(), name, entries: []}; veresiye.unshift(person); }
      person.entries.unshift(entry);
      saveVeresiye();
      closeModal();
      renderVeresiye();
      saleSuccessSound();
      toast('Elle borç eklendi · ' + name + ' · ' + money(amount));
    }

    function openVeresiye(){ hideDataMenu();
      stopLiveScanner();
      renderVeresiye();
      document.getElementById('veresiyeSheet').classList.add('show');
    }

    function renderVeresiye(){
      const el=document.getElementById('veresiyeContent');
      let undo='';
      if(deletedVeresiyeStack.length) undo=`<button class="btn btn-secondary" style="padding:6px 10px" onclick="undoVeresiye()">Geri Al</button>`;
      let html=`<h2>Veresiye <span style="display:flex;gap:6px">${undo}<button class="btn btn-secondary" style="padding:6px 12px" onclick="closeVeresiye()">Kapat</button></span></h2>
        <button class="btn btn-warn btn-block" style="margin-bottom:12px" onclick="openManualVeresiye()">+ Elle Borç Girişi</button>
        <div class="summary-row">
          <div class="summary-box"><div class="lbl">Toplam Veresiye</div><div class="val" style="color:#fbbf24">${money(totalVeresiye())}</div></div>
          <div class="summary-box"><div class="lbl">Kişi</div><div class="val">${veresiye.filter(v=>personBalance(v)>0).length}</div></div>
        </div>`;
      if(!veresiye.length){ html+=`<div class="empty">Veresiye kaydı yok</div>`; el.innerHTML=html; return; }
      const sortedVeresiye = [...veresiye].sort((a,b)=>(a.name||'').localeCompare(b.name||'','tr',{sensitivity:'base'}));
      sortedVeresiye.forEach((p,pi)=>{
        const bal=personBalance(p);
        const openId='vp_'+p.id;
        const sira = pi + 1;
        html+=`<div class="v-card">
          <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="toggleBlock('${openId}')">
            <div><strong>▸ ${sira}. ${p.name}</strong><div class="meta">${(p.entries||[]).length} kayıt</div></div>
            <div style="text-align:right"><div class="v-bal">${money(bal)}</div>
              <button class="btn btn-danger" style="padding:4px 8px;font-size:.75rem;margin-top:4px" onclick="event.stopPropagation();deletePerson('${p.id}')">Sil</button>
            </div>
          </div>
          <div id="${openId}" style="display:none;margin-top:10px">`;
        (p.entries||[]).forEach(e=>{
          const d=new Date(e.date);
          const day=d.toLocaleDateString('tr-TR',{day:'2-digit',month:'long',year:'numeric'});
          const time=d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
          const items=(e.items||[]).map(it=>`<div style="display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)"><span>${it.name} × ${it.qty}</span><span>${money(it.price*it.qty)}</span></div>`).join('');
          html+=`<div class="sale-item" style="opacity:${e.paid?.5:1}">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
              <div><strong>${day}</strong><div class="meta">${time}</div></div>
              <strong style="color:${e.paid?'#4ade80':'#fbbf24'}">${money(e.total)}${e.paid?' · Ödendi':''}</strong>
            </div>
            ${items}
            <div style="display:flex;gap:6px;margin-top:8px">
              ${!e.paid?`<button class="btn btn-success" style="padding:6px 10px;font-size:.8rem" onclick="markPaid('${p.id}','${e.id}')">Ödendi</button>`:''}
              <button class="btn btn-danger" style="padding:6px 10px;font-size:.8rem" onclick="deleteEntry('${p.id}','${e.id}')">Sil</button>
            </div>
          </div>`;
        });
        html+=`</div></div>`;
      });
      el.innerHTML=html;
    }

    function markPaid(pid,eid){
      const p=veresiye.find(x=>x.id===pid);
      if(!p) return;
      const e=p.entries.find(x=>x.id===eid);
      if(!e||e.paid) return;
      e.paid=true;
      // Ödenen tutarı satışlara da ekle (tahsilat)
      salesHistory.unshift({id:id(),date:new Date().toISOString(),total:e.total,items:e.items||[],fromVeresiye:true,person:p.name});
      saveSales();
      saveVeresiye();
      renderVeresiye();
      saleSuccessSound();
      toast('Ödendi · '+p.name+' · '+money(e.total));
    }

    function deleteEntry(pid,eid){
      const p=veresiye.find(x=>x.id===pid);
      if(!p) return;
      const idx=p.entries.findIndex(x=>x.id===eid);
      if(idx<0) return;
      deletedVeresiyeStack.push({type:'entry',personId:pid,entry:p.entries[idx]});
      p.entries.splice(idx,1);
      saveVeresiye();
      renderVeresiye();
      toast('Kayıt silindi');
    }

    function deletePerson(pid){
      const idx=veresiye.findIndex(x=>x.id===pid);
      if(idx<0) return;
      if(!confirm(veresiye[idx].name+' silinsin mi?')) return;
      deletedVeresiyeStack.push({type:'person',person:veresiye[idx]});
      veresiye.splice(idx,1);
      saveVeresiye();
      renderVeresiye();
      toast('Kişi silindi');
    }

    function undoVeresiye(){
      if(!deletedVeresiyeStack.length) return;
      const u=deletedVeresiyeStack.pop();
      if(u.type==='person'){ veresiye.unshift(u.person); }
      else if(u.type==='entry'){
        const p=veresiye.find(x=>x.id===u.personId);
        if(p) p.entries.unshift(u.entry);
      }
      saveVeresiye();
      renderVeresiye();
      toast('Geri alındı');
    }

    function closeVeresiye(){
      document.getElementById('veresiyeSheet').classList.remove('show');
      if(tab==='sales') startLiveScanner();
    }

    // ===== SATIŞLAR =====
    function openSales(){ hideDataMenu(); stopLiveScanner(); renderSalesSheet(); document.getElementById('salesSheet').classList.add('show'); }

    function renderSalesSheet(){
      const el=document.getElementById('salesContent');
      let undo=deletedSalesStack.length?`<button class="btn btn-secondary" style="padding:6px 10px" onclick="undoDeleteSale()">Geri Al</button>`:'';
      if(!salesHistory.length){
        el.innerHTML=`<h2>Satışlar <span style="display:flex;gap:6px">${undo}<button class="btn btn-secondary" style="padding:6px 12px" onclick="closeSales()">Kapat</button></span></h2>
          <div class="summary-box" style="margin-bottom:12px"><div class="lbl">Toplam Satış</div><div class="val" style="color:#4ade80">${money(0)}</div></div>
          <div class="empty">Henüz satış yok</div>`;
        return;
      }
      const groups={};
      salesHistory.forEach(s=>{
        const d=new Date(s.date);
        const mk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
        const dk=d.toLocaleDateString('tr-TR',{day:'2-digit',month:'long',year:'numeric'});
        if(!groups[mk]) groups[mk]={total:0,days:{}};
        if(!groups[mk].days[dk]) groups[mk].days[dk]=[];
        groups[mk].days[dk].push(s);
        groups[mk].total+=s.total;
      });
      const monthNames=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
      let html=`<h2>Satışlar <span style="display:flex;gap:6px">${undo}<button class="btn btn-secondary" style="padding:6px 12px" onclick="closeSales()">Kapat</button></span></h2>
        <div class="summary-box" style="margin-bottom:12px"><div class="lbl">Toplam Satış</div><div class="val" style="color:#4ade80">${money(totalSales())}</div></div>`;
      Object.keys(groups).sort().reverse().forEach(mk=>{
        const [y,m]=mk.split('-');
        const mid='m_'+mk;
        html+=`<div class="month-header" onclick="toggleBlock('${mid}')"><span>▸ ${monthNames[parseInt(m)-1]} ${y}</span><span>${money(groups[mk].total)}</span></div><div id="${mid}" style="display:none">`;
        Object.keys(groups[mk].days).forEach((day,di)=>{
          const did='d_'+mk+'_'+di;
          const dayTotal=groups[mk].days[day].reduce((s,x)=>s+x.total,0);
          html+=`<div class="day-header" onclick="toggleBlock('${did}')"><span>▸ ${day}</span><span style="color:#60a5fa">${money(dayTotal)}</span></div><div id="${did}" style="display:none">`;
          groups[mk].days[day].forEach(s=>{
            const time=new Date(s.date).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
            const items=(s.items||[]).map(it=>`<div style="display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)"><span>${it.name} × ${it.qty}</span><span>${money(it.price*it.qty)}</span></div>`).join('');
            const tag=s.fromVeresiye?` <span style="color:#fbbf24;font-size:.75rem">(Veresiye tahsilat${s.person?' · '+s.person:''})</span>`:'';
            html+=`<div class="sale-item">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                <span style="font-weight:600">${time}${tag}</span>
                <div style="display:flex;align-items:center;gap:8px">
                  <strong style="color:#60a5fa">${money(s.total)}</strong>
                  <button class="btn btn-danger" style="padding:4px 10px;font-size:.78rem" onclick="deleteSale('${s.id}')">Sil</button>
                </div>
              </div>${items||''}</div>`;
          });
          html+=`</div>`;
        });
        html+=`</div>`;
      });
      el.innerHTML=html;
    }

    function toggleBlock(id){
      const el=document.getElementById(id); if(!el) return;
      const open=el.style.display!=='none';
      el.style.display=open?'none':'block';
      const prev=el.previousElementSibling;
      if(prev){ const span=prev.querySelector('span'); if(span&&span.textContent){ span.textContent=open?span.textContent.replace('▾','▸'):span.textContent.replace('▸','▾'); } }
    }
    function deleteSale(sid){
      const idx=salesHistory.findIndex(s=>s.id===sid); if(idx<0) return;
      deletedSalesStack.push(salesHistory.splice(idx,1)[0]);
      saveSales(); renderSalesSheet(); toast('Satış silindi');
    }
    function undoDeleteSale(){
      if(!deletedSalesStack.length) return;
      salesHistory.push(deletedSalesStack.pop());
      salesHistory.sort((a,b)=>new Date(b.date)-new Date(a.date));
      saveSales(); renderSalesSheet(); toast('Geri alındı');
    }
    function closeSales(){ document.getElementById('salesSheet').classList.remove('show'); if(tab==='sales') startLiveScanner(); }

    // ===== KAMERA =====
    function startLiveScanner(){
      const st=document.getElementById('scanStatus');
      const wrap=document.querySelector('.scanner-wrap');
      if(location.protocol==='file:'){ if(st) st.textContent='HTTPS gerekli'; return; }
      if(typeof Html5Qrcode==='undefined'){ if(st) st.textContent='Kütüphane yükleniyor...'; setTimeout(startLiveScanner,500); return; }
      if(liveScanner){ try{liveScanner.stop().catch(()=>{});}catch(e){} liveScanner=null; }
      const oldBtn=document.getElementById('camStartBtn'); if(oldBtn) oldBtn.remove();
      const config={fps:20,qrbox:(w,h)=>({width:Math.floor(w*0.9),height:Math.floor(Math.min(h*0.3,140))}),aspectRatio:1.333};
      const onSuccess=(code)=>{ const now=Date.now(); if(code===lastCode&&now-lastScanTime<1100) return; lastCode=code; lastScanTime=now; onBarcodeDetected(code); };
      const onReady=()=>{ if(st){st.textContent='Hazır · Barkodu tut'; st.classList.add('active');} const b=document.getElementById('camStartBtn'); if(b)b.remove();
        setTimeout(()=>{document.querySelectorAll('#liveScanner div').forEach(d=>{try{if(d.style)d.style.border='none';}catch(e){}});},400); };
      const showCamButton=(msg)=>{ if(st) st.textContent=msg||'Kamera izni gerekli'; if(document.getElementById('camStartBtn')) return;
        const btn=document.createElement('button'); btn.id='camStartBtn'; btn.className='btn btn-primary';
        btn.style.cssText='position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;padding:16px 28px;font-size:1.05rem;border-radius:16px';
        btn.textContent='📷 Kamerayı Aç';
        btn.onclick=(e)=>{e.preventDefault();btn.textContent='Açılıyor...';requestCamera();};
        if(wrap) wrap.appendChild(btn); };
      const requestCamera=()=>{
        const scanner=new Html5Qrcode('liveScanner',{verbose:false}); liveScanner=scanner;
        scanner.start({facingMode:'environment'},config,onSuccess,()=>{}).then(onReady).catch(()=>{
          Html5Qrcode.getCameras().then(cams=>{
            if(!cams||!cams.length){showCamButton('Kamera bulunamadı');return;}
            let cid=cams[cams.length-1].id;
            const back=cams.find(c=>/back|arka|rear|environment/i.test(c.label||''));
            if(back) cid=back.id;
            const s2=new Html5Qrcode('liveScanner',{verbose:false}); liveScanner=s2;
            s2.start(cid,config,onSuccess,()=>{}).then(onReady).catch(()=>showCamButton('İzin verin · Tekrar deneyin'));
          }).catch(()=>showCamButton('İzin verin · Tekrar deneyin'));
        });
      };
      requestCamera();
    }
    function stopLiveScanner(){ if(liveScanner){ liveScanner.stop().catch(()=>{}); liveScanner=null; } }

    function onBarcodeDetected(code){
      beep();
      let p=products.find(x=>x.barcode===code);
      if(!p){ if(confirm(`"${code}" kayıtlı değil.\nYeni ürün ekle?`)){ openModal(); setTimeout(()=>{const b=document.getElementById('b');if(b)b.value=code;},150);} return; }
      addCart(p);
    }
    function manualSales(){ const code=prompt('Barkodu girin:'); if(code) onBarcodeDetected(code.trim()); }
    function addCart(p){
      if(p.stock<=0){ toast('Stokta yok'); return; }
      const ex=cart.find(c=>c.id===p.id);
      if(ex){ if(ex.qty>=p.stock){toast('Stok yetersiz');return;} ex.qty++; }
      else cart.push({id:p.id,name:p.name,price:p.price,qty:1});
      updateCartUI(); toast(p.name+' eklendi');
    }

    function openModal(pid=null){
      stopLiveScanner(); editId=pid;
      const p=pid?products.find(x=>x.id===pid):{name:'',barcode:'',price:0,stock:0};
      document.getElementById('modal').innerHTML=`
        <h2>${pid?'Ürünü Düzenle':'Yeni Ürün'}</h2>
        <div class="form-group"><label>Ürün Adı</label><input id="n" value="${p.name||''}"></div>
        <div class="form-group"><label>Barkod</label><input id="b" value="${p.barcode||''}"></div>
        <div class="form-row">
          <div class="form-group"><label>Fiyat (₺)</label><input id="pr" type="number" step="0.01" value="${p.price||0}"></div>
          <div class="form-group"><label>Stok</label><input id="st" type="number" value="${p.stock||0}"></div>
        </div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn btn-primary btn-block" onclick="saveProduct()">${pid?'Güncelle':'Kaydet'}</button>
          ${pid?`<button class="btn btn-danger" onclick="delProduct()">Sil</button>`:''}
        </div>`;
      document.getElementById('modalBg').classList.add('show');
    }
    function saveProduct(){
      const name=document.getElementById('n').value.trim(); if(!name){toast('Ürün adı gerekli');return;}
      const barcode=document.getElementById('b').value.trim();
      const price=parseFloat(document.getElementById('pr').value)||0;
      const stock=parseInt(document.getElementById('st').value)||0;
      if(editId){ const p=products.find(x=>x.id===editId); p.name=name;p.barcode=barcode;p.price=price;p.stock=stock; }
      else products.push({id:id(),name,barcode,price,stock});
      products.sort((a,b)=>(a.name||'').localeCompare(b.name||'','tr',{sensitivity:'base'}));
      save(); closeModal(); render(); toast(editId?'Güncellendi':'Eklendi');
    }
    function delProduct(){ if(!confirm('Silinsin mi?')) return; products=products.filter(p=>p.id!==editId); save(); closeModal(); render(); toast('Silindi'); }
    function closeModal(){ document.getElementById('modalBg').classList.remove('show'); if(tab==='sales') startLiveScanner(); }

    function openToplam(){ hideDataMenu();
      stopLiveScanner();
      const stokDeger = products.reduce((s,p)=>s+(p.price||0)*(p.stock||0),0);
      const stokAdet = products.reduce((s,p)=>s+(p.stock||0),0);
      const satis = totalSales();
      const veres = totalVeresiye();
      const satisVeresiye = satis + veres;
      const kisi = veresiye.filter(v=>personBalance(v)>0).length;
      document.getElementById('toplamContent').innerHTML = `
        <h2>Toplam <button class="btn btn-secondary" style="padding:6px 12px" onclick="closeToplam()">Kapat</button></h2>
        <div class="v-card">
          <div class="meta">Satış Toplamı</div>
          <div style="font-size:1.35rem;font-weight:700;color:#4ade80;margin-top:4px">${money(satis)}</div>
          <div class="meta" style="margin-top:4px">${salesHistory.length} satış kaydı</div>
        </div>
        <div class="v-card">
          <div class="meta">Veresiye Bakiye</div>
          <div style="font-size:1.35rem;font-weight:700;color:#fbbf24;margin-top:4px">${money(veres)}</div>
          <div class="meta" style="margin-top:4px">${kisi} kişide açık borç</div>
        </div>
        <div class="v-card">
          <div class="meta">Satış + Veresiye</div>
          <div style="font-size:1.35rem;font-weight:700;color:#60a5fa;margin-top:4px">${money(satisVeresiye)}</div>
        </div>
        <div class="v-card">
          <div class="meta">Stok Fiyat Toplamı</div>
          <div style="font-size:1.35rem;font-weight:700;color:#a78bfa;margin-top:4px">${money(stokDeger)}</div>
          <div class="meta" style="margin-top:4px">${products.length} ürün · ${stokAdet} adet</div>
        </div>
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
          <div class="meta" style="text-align:center">Özet</div>
          <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:.9rem"><span>Satış</span><strong style="color:#4ade80">${money(satis)}</strong></div>
          <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:.9rem"><span>Veresiye</span><strong style="color:#fbbf24">${money(veres)}</strong></div>
          <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:.9rem"><span>Stok</span><strong style="color:#a78bfa">${money(stokDeger)}</strong></div>
          <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:1.05rem;padding-top:8px;border-top:1px solid var(--border)"><span>Genel Toplam (S+V)</span><strong style="color:#60a5fa">${money(satisVeresiye)}</strong></div>
        </div>`;
      document.getElementById('toplamSheet').classList.add('show');
    }
    function closeToplam(){
      document.getElementById('toplamSheet').classList.remove('show');
      if(tab==='sales') startLiveScanner();
    }

    function toggleDataMenu(){
      const m = document.getElementById('dataMenu');
      m.style.display = m.style.display === 'none' ? 'block' : 'none';
    }
    function hideDataMenu(){
      const m = document.getElementById('dataMenu');
      if(m) m.style.display = 'none';
    }

    function exportExcel(){
      if(!products.length){toast('Ürün yok');return;}
      let csv='Barkod,Ürün Adı,Fiyat,Stok\n';
      products.forEach(p=>{csv+=`"${p.barcode||''}","${(p.name||'').replace(/"/g,'""')}",${p.price||0},${p.stock||0}\n`;});
      const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
      const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='urunler-'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); URL.revokeObjectURL(url); toast('Excel indirildi');
    }
    function importExcel(e){
      const file=e.target.files[0]; if(!file) return;
      const reader=new FileReader();
      reader.onload=ev=>{
        const lines=ev.target.result.split(/\r?\n/).filter(l=>l.trim()); let added=0;
        for(let i=1;i<lines.length;i++){
          const cols=lines[i].match(/(".*?"|[^,]+)/g)||[]; if(cols.length<2) continue;
          const barcode=(cols[0]||'').replace(/^"|"$/g,'').trim();
          const name=(cols[1]||'').replace(/^"|"$/g,'').trim();
          const price=parseFloat(cols[2])||0; const stock=parseInt(cols[3])||0; if(!name) continue;
          let existing=products.find(p=>p.barcode&&p.barcode===barcode);
          if(existing){existing.name=name;existing.price=price;existing.stock=stock;}
          else products.push({id:id(),name,barcode,price,stock}); added++;
        }
        products.sort((a,b)=>(a.name||'').localeCompare(b.name||'','tr',{sensitivity:'base'})); save(); render(); toast(added+' ürün yüklendi');
      };
      reader.readAsText(file); e.target.value='';
    }

    document.querySelector('.tabs').onclick=e=>{
      if(e.target.tagName==='BUTTON'){ document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active')); e.target.classList.add('active'); tab=e.target.dataset.tab; render(); }
    };
    document.getElementById('salesSheet').onclick=e=>{if(e.target.id==='salesSheet') closeSales();};
    document.getElementById('veresiyeSheet').onclick=e=>{if(e.target.id==='veresiyeSheet') closeVeresiye();};
    document.getElementById('toplamSheet').onclick=e=>{if(e.target.id==='toplamSheet') closeToplam();};
    document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg') closeModal();};
    window.addEventListener('beforeunload', stopLiveScanner);
    render();
  </script>
</body>
</html>
